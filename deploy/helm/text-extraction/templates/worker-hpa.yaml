{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- $worker := index $.Values.workers $pool }}
{{- if and $worker.enabled $worker.autoscaling.hpa.enabled }}
{{- $hpa := $worker.autoscaling.hpa }}
{{- $args := list $ $pool }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "text-extraction.workerName" $args }}
  labels:
    {{- include "text-extraction.workerLabels" $args | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "text-extraction.workerName" $args }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
