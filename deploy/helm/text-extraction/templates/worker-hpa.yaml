{{- if and .Values.workers.extract.enabled .Values.workers.extract.autoscaling.hpa.enabled }}
{{- $hpa := .Values.workers.extract.autoscaling.hpa }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "text-extraction.workerExtractName" . }}
  labels:
    {{- include "text-extraction.workerExtractLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "text-extraction.workerExtractName" . }}
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
{{- end }}
