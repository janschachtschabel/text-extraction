{{- /* One Deployment per enabled worker pool (workers.extract, workers.browser). */ -}}
{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- $worker := index $.Values.workers $pool }}
{{- if $worker.enabled }}
{{- $args := list $ $pool }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "text-extraction.workerName" $args }}
  labels:
    {{- include "text-extraction.workerLabels" $args | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $pool }}
spec:
  {{- if not (or $worker.autoscaling.keda.enabled $worker.autoscaling.hpa.enabled) }}
  replicas: {{ $worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "text-extraction.workerSelectorLabels" $args | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if and $.Values.secrets.apiKeys (not $.Values.secrets.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "text-extraction.workerSelectorLabels" $args | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "text-extraction.workerImage" $args | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - {{ include "text-extraction.workerCommand" $pool }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: internal
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "text-extraction.fullname" $ }}
          env:
            - name: INTERNAL_PORT
              value: "9090"
            {{- if eq $pool "browser" }}
            - name: BROWSER_CONCURRENCY
              value: {{ $worker.concurrency | toString | quote }}
            {{- else }}
            - name: WORKER_CONCURRENCY
              value: {{ $worker.concurrency | toString | quote }}
            {{- end }}
            {{- include "text-extraction.browserEnv" $ | nindent 12 }}
            {{- include "text-extraction.valkeyEnv" $ | trim | nindent 12 }}
            {{- with include "text-extraction.apiKeysEnv" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: internal
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          {{- if $worker.tmpSizeLimit }}
          emptyDir:
            sizeLimit: {{ $worker.tmpSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
