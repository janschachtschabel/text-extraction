{{- /* One Deployment per enabled worker pool (workers.extract, workers.browser, workers.docling,
workers.asr, workers.nlp). The Docling workers, the NLP workers and the ASR workers of the local
backend also mount their models volume read-only; with models.downloadMode init (the default) an init container first downloads
the models into it (writable), with job the hook Job of models-job.yaml does, and with
models.download false nobody does. The ASR workers keep downloaded media on a bounded emptyDir at
/scratch. */ -}}
{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- $worker := index $.Values.workers $pool }}
{{- if $worker.enabled }}
{{- $args := list $ $pool }}
{{- $models := include "text-extraction.workerHasModels" $args }}
{{- $asr := eq $pool "asr" }}
{{- /* The env of the worker (and of its models init container). */}}
{{- $env := include "text-extraction.workerEnv" $args }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "text-extraction.workerName" $args }}
  labels:
    {{- include "text-extraction.workerLabels" $args | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $pool }}
spec:
  {{- if not (or $worker.autoscaling.keda.enabled $worker.autoscaling.hpa.enabled) }}
  replicas: {{ $worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "text-extraction.workerSelectorLabels" $args | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if or (and $.Values.secrets.apiKeys (not $.Values.secrets.existingSecret)) (and $asr $.Values.workers.asr.external.apiKey (not $.Values.workers.asr.external.existingSecret)) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "text-extraction.workerSelectorLabels" $args | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if eq (include "text-extraction.modelsDownload" $args) "init" }}
      initContainers:
        # Fills the models volume from the manifest (SHA-256 checked); does nothing when the
        # volume already holds this manifest's files.
        - name: models
          image: {{ include "text-extraction.workerImage" $args | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - {{ include "text-extraction.workerCommand" $pool }}
            - --download-models
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: {{ include "text-extraction.fullname" $ }}
          env:
            {{- $env | nindent 12 }}
          resources:
            {{- toYaml $worker.models.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
      {{- end }}
      containers:
        - name: worker
          image: {{ include "text-extraction.workerImage" $args | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - {{ include "text-extraction.workerCommand" $pool }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: internal
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "text-extraction.fullname" $ }}
          env:
            {{- $env | nindent 12 }}
            {{- if eq $pool "nlp" }}
            {{- with include "text-extraction.nlpKeyEnv" $ | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: internal
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $models }}
            - name: models
              mountPath: /models
              readOnly: true
            {{- end }}
            {{- if $asr }}
            - name: scratch
              mountPath: /scratch
            {{- end }}
      volumes:
        - name: tmp
          {{- if $worker.tmpSizeLimit }}
          emptyDir:
            sizeLimit: {{ $worker.tmpSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $models }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "text-extraction.workerModelsClaim" $args }}
        {{- end }}
        {{- if $asr }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ $worker.scratch.sizeLimit }}
        {{- end }}
      {{- /* The pool's nodeSelector wins over the global one, key by key. */}}
      {{- with merge (deepCopy ($worker.nodeSelector | default dict)) (deepCopy ($.Values.nodeSelector | default dict)) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
