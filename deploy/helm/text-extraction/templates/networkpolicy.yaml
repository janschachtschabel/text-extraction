{{- if .Values.networkPolicy.enabled }}
{{- if .Values.valkey.enabled }}
# Valkey accepts connections from the API and worker pods of this release only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.valkeyName" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.valkeySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "text-extraction.selectorLabels" . | nindent 14 }}
        {{- if .Values.workers.extract.enabled }}
        - podSelector:
            matchLabels:
              {{- include "text-extraction.workerExtractSelectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - port: 6379
          protocol: TCP
---
{{- end }}
# API pods: the public port from anywhere, the internal port from `networkPolicy.metricsFrom`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.fullname" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9090
          protocol: TCP
    {{- end }}
{{- if .Values.workers.extract.enabled }}
---
# Workers take no traffic except the metrics scrape of `networkPolicy.metricsFrom`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.workerExtractName" . }}
  labels:
    {{- include "text-extraction.workerExtractLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker-extract
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.workerExtractSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.metricsFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9090
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
