{{- if .Values.networkPolicy.enabled }}
{{- if .Values.valkey.enabled }}
# Valkey accepts connections from the API and worker pods (extract, browser) of this release only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.valkeyName" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.valkeySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "text-extraction.selectorLabels" . | nindent 14 }}
        {{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
        {{- if (index $.Values.workers $pool).enabled }}
        - podSelector:
            matchLabels:
              {{- include "text-extraction.workerSelectorLabels" (list $ $pool) | nindent 14 }}
        {{- end }}
        {{- end }}
      ports:
        - port: 6379
          protocol: TCP
---
{{- end }}
# API pods: the public port from anywhere, the internal port from `networkPolicy.metricsFrom`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.fullname" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9090
          protocol: TCP
    {{- end }}
{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- if (index $.Values.workers $pool).enabled }}
---
# Workers take no traffic except the metrics scrape of `networkPolicy.metricsFrom`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "text-extraction.workerName" (list $ $pool) }}
  labels:
    {{- include "text-extraction.workerLabels" (list $ $pool) | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $pool }}
spec:
  podSelector:
    matchLabels:
      {{- include "text-extraction.workerSelectorLabels" (list $ $pool) | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with $.Values.networkPolicy.metricsFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 9090
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
