{{- if .Values.workers.extract.enabled }}
# Internal port 9090 (/health, /ready, /metrics) of the extract workers. Cluster-internal only;
# it exists for the ServiceMonitor, no traffic is routed through it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "text-extraction.workerExtractInternalServiceName" . }}
  labels:
    {{- include "text-extraction.workerExtractLabels" . | nindent 4 }}
    app.kubernetes.io/component: internal
spec:
  type: ClusterIP
  ports:
    - name: internal
      port: 9090
      targetPort: internal
      protocol: TCP
  selector:
    {{- include "text-extraction.workerExtractSelectorLabels" . | nindent 4 }}
{{- end }}
