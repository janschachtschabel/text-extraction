{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- if (index $.Values.workers $pool).enabled }}
{{- $args := list $ $pool }}
---
# Internal port 9090 (/health, /ready, /metrics) of the {{ $pool }} workers. Cluster-internal
# only; it exists for the ServiceMonitor, no traffic is routed through it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "text-extraction.workerInternalServiceName" $args }}
  labels:
    {{- include "text-extraction.workerLabels" $args | nindent 4 }}
    app.kubernetes.io/component: internal
spec:
  type: ClusterIP
  ports:
    - name: internal
      port: 9090
      targetPort: internal
      protocol: TCP
  selector:
    {{- include "text-extraction.workerSelectorLabels" $args | nindent 4 }}
{{- end }}
{{- end }}
