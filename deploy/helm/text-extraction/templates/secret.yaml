{{- if and .Values.secrets.apiKeys (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "text-extraction.secretName" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.existingSecretKey }}: {{ .Values.secrets.apiKeys | quote }}
{{- end }}
