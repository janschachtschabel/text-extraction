{{- if and .Values.secrets.apiKeys (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "text-extraction.secretName" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.existingSecretKey }}: {{ .Values.secrets.apiKeys | quote }}
{{- end }}
{{- $asr := .Values.workers.asr }}
{{- if and $asr.enabled (eq (toString $asr.backend) "openai") $asr.external.apiKey (not $asr.external.existingSecret) }}
---
# ASR_EXTERNAL_API_KEY of the external transcription endpoint, for the API pods and the ASR workers.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "text-extraction.asrSecretName" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $asr.external.existingSecretKey }}: {{ $asr.external.apiKey | quote }}
{{- end }}
