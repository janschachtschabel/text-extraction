{{- range $pool := splitList " " (include "text-extraction.workerPools" $) }}
{{- $worker := index $.Values.workers $pool }}
{{- if and $worker.enabled $worker.autoscaling.keda.enabled }}
{{- $keda := $worker.autoscaling.keda }}
{{- $args := list $ $pool }}
---
# Scales the {{ $pool }} workers on the length of their pool's queue{{ if $keda.countLeased }} plus the items in flight{{ end }}. The
# gauges come from the API pods (they stay up while the workers are scaled down) and need
# JOBS_ENABLED=true there (for the pool browser also BROWSER_ENABLED=true, for docling
# DOCLING_ENABLED=true, for asr ASR_ENABLED=true, for nlp PII_ENABLED=true, for llm LLM_ENABLED=true); max() because every API pod reports the same
# queue.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "text-extraction.workerName" $args }}
  labels:
    {{- include "text-extraction.workerLabels" $args | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "text-extraction.workerName" $args }}
  minReplicaCount: {{ $keda.minReplicaCount }}
  maxReplicaCount: {{ $keda.maxReplicaCount }}
  {{- $window := $worker.autoscaling.scaleDownStabilizationWindowSeconds }}
  {{- if not (kindIs "invalid" $window) }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $window }}
  {{- end }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ required (printf "workers.%s.autoscaling.keda.serverAddress is required" $pool) $keda.serverAddress | quote }}
        {{- $selector := printf `{pool="%s", namespace="%s"}` $pool $.Release.Namespace }}
        {{- $query := printf "max(text_extraction_queue_pending_items%s)" $selector }}
        {{- if $keda.countLeased }}
        {{- $query = printf "%s + max(text_extraction_queue_leased_items%s)" $query $selector }}
        {{- end }}
        query: {{ $query | quote }}
        threshold: {{ include "text-extraction.kedaThreshold" $args | quote }}
{{- end }}
{{- end }}
