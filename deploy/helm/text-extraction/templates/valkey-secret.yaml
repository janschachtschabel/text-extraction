{{- if and (include "text-extraction.valkeyAuth" .) (not .Values.valkey.auth.existingSecret) }}
{{- /* The password is generated once and kept: a later render reads it back from the cluster.
       Without a cluster (helm template) lookup returns nothing and a new one is generated. */ -}}
{{- $name := include "text-extraction.valkeySecretName" . }}
{{- $key := .Values.valkey.auth.existingSecretKey }}
{{- $password := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (.data | default dict) $key }}
{{- $password = b64dec . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
