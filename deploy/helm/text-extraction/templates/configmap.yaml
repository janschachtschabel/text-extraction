{{- include "text-extraction.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "text-extraction.fullname" . }}
  labels:
    {{- include "text-extraction.labels" . | nindent 4 }}
data:
  {{- /* MCP_ENABLED and UI_ENABLED come from mcp.enabled and ui.enabled, on the API pods only. */}}
  {{- range $key, $value := omit .Values.config "MCP_ENABLED" "UI_ENABLED" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
