# Default values for the text-extraction chart. Every key is documented in README.md.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/janschachtschabel/text-extraction
  # Defaults to the chart appVersion. Production uses SemVer tags; `latest` is for staging only.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# Seconds Kubernetes waits after SIGTERM before it kills an API pod. On SIGTERM the server first
# reports not ready and keeps serving for SHUTDOWN_DRAIN_SECONDS (5), then lets requests in
# flight finish for its graceful time, then stops the internal port. The graceful time is
# max(30, EXTRACT_TIMEOUT_SECONDS + 5) (30 s), and with browser workers (BROWSER_ENABLED) at least
# EXTRACT_TIMEOUT_SECONDS + BROWSER_QUEUE_WAIT_SECONDS + the render deadline + 10, where the render
# deadline is BROWSER_TIMEOUT_SECONDS, with unblock mode the larger of it and
# BROWSER_UNBLOCK_TIMEOUT_SECONDS: 25 + 10 + 30 + 10 = 75 s, with unblock 105 s. With Docling
# workers (DOCLING_ENABLED) it is also at least EXTRACT_TIMEOUT_SECONDS +
# DOCLING_SYNC_WAIT_SECONDS + 5: 25 + 20 + 5 = 50 s.
# Unset (the default), the chart sets drain + graceful + a 10 s margin from config.* or the
# defaults: 45 without browser or Docling workers, 65 with Docling workers only, 90 with browser
# workers, 120 with unblock mode. A value set here must be at least that, or the render fails.
terminationGracePeriodSeconds: null

# Non-secret settings. Each key becomes an environment variable of the same name
# (rendered into a ConfigMap and passed with envFrom). Values are quoted strings.
# PUBLIC_PORT (8080) and INTERNAL_PORT (9090) are fixed by the chart.
config:
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  AUTH_MODE: api_key
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  # Conversions at once per pod; the memory limit below is sized for it.
  CONVERT_CONCURRENCY: "2"
  # Not ready, but still serving, this long after SIGTERM; see terminationGracePeriodSeconds.
  SHUTDOWN_DRAIN_SECONDS: "5"
  # FETCH_MAX_BYTES (download limit) and DOCUMENT_MAX_BYTES (largest document and upload) are both
  # 20000000 by default. Lower them together: DOCUMENT_MAX_BYTES must not exceed FETCH_MAX_BYTES,
  # or every pod exits with code 2 at start-up.
  # DOCUMENT_MEMORY_LIMIT_MB (the address space of one conversion child) is rendered from each
  # pod's memory limit unless set here; see `documentParentReserveMiB`.
  # DOCLING_INPUT_BUDGET_BYTES (200000000): the most bytes that documents queued for OCR and slow
  # uploads may hold in Valkey at once, across all pods. Beyond it nothing more is queued (the
  # text layer answers with ocr_unavailable). Size valkey.maxmemory for it.

# Secrets. API_KEYS is a JSON list of {"name", "role", "sha256", "rate_limit_per_minute"} objects.
# Set `apiKeys` for a chart-managed Secret, or point `existingSecret` at your own Secret.
secrets:
  apiKeys: ""
  # Name of an existing Secret that holds the API_KEYS JSON. Takes precedence over `apiKeys`.
  existingSecret: ""
  # Key inside the existing Secret.
  existingSecretKey: API_KEYS

# Placeholder values until package 11 measures real consumption. The memory limit covers the
# service with CONVERT_CONCURRENCY page conversions (a page at CONVERT_MAX_BYTES, 5 MiB, peaks at
# about 450 MB) and the DOCUMENT_CONCURRENCY (2) document conversion children (MarkItDown; about
# 150 MB each when idle, more with a large document). The chart gives each child an even share
# of the limit after `documentParentReserveMiB` as its address space (DOCUMENT_MEMORY_LIMIT_MB):
# (2048 - 512) / 2 = 768 MiB here, so a child runs out of memory (too_large) before the
# container's OOM killer ends the pod (and the children raise their oom_score_adj, so the killer
# picks a child over the server). Raise the limit with either concurrency.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi

# MiB of the API container's memory limit kept for everything but the document conversion
# children: the server, its page conversions and its caches. DOCUMENT_MEMORY_LIMIT_MB is
# floor((resources.limits.memory - this) / DOCUMENT_CONCURRENCY), at least 256 (else the render
# fails); config.DOCUMENT_MEMORY_LIMIT_MB wins when set, and without a memory limit the
# service's default (2048) applies.
documentParentReserveMiB: 512

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Jobs (POST /v1/batch, GET /v1/jobs/{id}, slow POST /v1/extract) are executed by the workers below.
jobs:
  # Rendered as JOBS_ENABLED on the API pods. Unset (the default) means true while
  # `workers.extract.enabled` is true and false without extract workers, so an API-only install
  # answers 503 on the job routes instead of accepting jobs nobody works on. Set it to true or
  # false to override. A `config.JOBS_ENABLED` entry is ignored: the chart sets the variable.
  # Only API pods with JOBS_ENABLED=true export the queue gauges that KEDA and the alerts read.
  enabled: null

workers:
  # Extract workers: they claim job items from the fair queue in Valkey and run the extraction
  # pipeline. They serve only the internal port 9090 (/health, /ready, /metrics), have no ingress
  # and use the same ConfigMap and Secrets as the API pods (API_KEYS is required while
  # AUTH_MODE is api_key). `config.*` applies to them as well.
  extract:
    enabled: true
    replicaCount: 2
    # Job items one worker pod processes at once (WORKER_CONCURRENCY). Conversions are still
    # capped by config.CONVERT_CONCURRENCY. Rendered into the pod env: a config.WORKER_CONCURRENCY
    # entry is ignored.
    concurrency: 8
    # No drain wait (no Service sends traffic to a worker). On SIGTERM the worker stops claiming
    # and gives items in flight max(30, EXTRACT_TIMEOUT_SECONDS + 5) seconds (30), plus a margin.
    # The render fails when that is above this value minus 10 s (config.EXTRACT_TIMEOUT_SECONDS,
    # default 25): raise this value with the timeout.
    terminationGracePeriodSeconds: 45
    # Placeholder values until package 11 measures real consumption. As for the API pods: the
    # worker with its page conversions and its document conversion children, each child with
    # (limit - documentParentReserveMiB) / DOCUMENT_CONCURRENCY of address space (768 MiB).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi
    # As the top-level documentParentReserveMiB, for these pods.
    documentParentReserveMiB: 512
    # Merged over the global `nodeSelector` for these pods; a key set here wins.
    nodeSelector: {}
    # KEDA and the HPA are mutually exclusive: enabling both fails the render. With either one on,
    # `replicaCount` is ignored.
    autoscaling:
      keda:
        # Needs the KEDA operator and Prometheus scraping the API pods (metrics.serviceMonitor).
        # The queue gauges come only from API pods with JOBS_ENABLED=true (see `jobs.enabled`):
        # the scaler sees nothing, and the workers stay at minReplicaCount, if none has it.
        enabled: false
        # Prometheus that KEDA queries. Change it to your Prometheus Service.
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        # Pending queue items per worker replica. null: the pool's `concurrency`.
        threshold: 50
        # Also count the items the workers hold (leased), not only the pending ones: true keeps
        # a replica per `threshold` items in flight (the asr pool's default).
        countLeased: false
        minReplicaCount: 1
        maxReplicaCount: 10
      hpa:
        enabled: false
        minReplicas: 2
        maxReplicas: 10
        targetCPUUtilizationPercentage: 70
      # How long (0 to 3600 s) the load must stay lower before KEDA or the HPA removes a
      # replica: Kubernetes keeps the highest recommendation of that window. null: the
      # Kubernetes default (300 s).
      scaleDownStabilizationWindowSeconds: null

  # Browser workers: they claim the items of the pool `browser` (mode "browser", screenshots,
  # "auto" results that need a browser) and render them in Chromium; in unblock mode in Google
  # Chrome under Xvfb. Image `workers.browser.image`, internal port 9090 only, no ingress, same
  # ConfigMap and Secrets as the API pods. The chart renders BROWSER_ENABLED from `enabled` and
  # BROWSER_UNBLOCK_ENABLED from `unblock` into the API, extract worker and browser worker pods:
  # config.BROWSER_ENABLED and config.BROWSER_UNBLOCK_ENABLED entries are ignored.
  browser:
    enabled: true
    # Unblock mode (admins with compliance "ignore" only; see docs/configuration.md). Needs
    # `enabled`.
    unblock: false
    image:
      repository: ghcr.io/janschachtschabel/text-extraction-browser
      # Defaults to image.tag, then the chart appVersion: both images are released together.
      # The pull policy is image.pullPolicy.
      tag: ""
    replicaCount: 2
    # Pages one pod renders at once, also its job slots (BROWSER_CONCURRENCY). Rendered into the
    # pod env: a config.BROWSER_CONCURRENCY entry is ignored. The resources below are sized for it.
    concurrency: 4
    # No drain wait. On SIGTERM the worker stops claiming and gives renders in flight
    # max(30, EXTRACT_TIMEOUT_SECONDS + 5, render deadline + 10) seconds: 40 s, 70 s with unblock
    # mode (BROWSER_UNBLOCK_TIMEOUT_SECONDS 60). The render fails when that plus a 10 s margin
    # is above this value.
    terminationGracePeriodSeconds: 150
    # Placeholder values until package 11 measures real consumption: a browser with four pages
    # plus the conversions.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    # As the top-level documentParentReserveMiB, for these pods: the reserve covers Chromium with
    # `concurrency` pages as well, so each document conversion child gets (4096 - 2560) / 2 = 768
    # MiB of address space (DOCUMENT_MEMORY_LIMIT_MB).
    documentParentReserveMiB: 2560
    # Size limit of the emptyDir at /tmp: browser profiles, Chrome's caches and Xvfb's socket.
    # The browsers use it instead of /dev/shm (--disable-dev-shm-usage).
    tmpSizeLimit: 2Gi
    # Merged over the global `nodeSelector` for these pods; a key set here wins. The browser image
    # exists for linux/amd64 only (Google Chrome stable), so the pods stay off other nodes.
    nodeSelector:
      kubernetes.io/arch: amd64
    # As for the extract workers. KEDA reads the pool `browser` gauges that API pods export with
    # JOBS_ENABLED=true and BROWSER_ENABLED=true. Keep at least one replica: a sync request
    # waits only BROWSER_QUEUE_WAIT_SECONDS (10) for a worker to take its page.
    autoscaling:
      keda:
        enabled: false
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        # Pending queue items per worker replica (about two rounds of `concurrency`).
        threshold: 8
        minReplicaCount: 1
        maxReplicaCount: 10
      hpa:
        enabled: false
        minReplicas: 2
        maxReplicas: 10
        targetCPUUtilizationPercentage: 70

  # Docling workers (OCR, D3: off by default): they claim the items of the pool `docling` (scans,
  # broken text layers, images, OpenDocument files) and convert them with Docling and Tesseract.
  # Image `workers.docling.image` (about 2 GB), internal port 9090 only, no ingress, same ConfigMap
  # and Secrets as the API pods. The chart renders DOCLING_ENABLED from `enabled` into the API,
  # extract worker, browser worker and Docling worker pods: a config.DOCLING_ENABLED entry is
  # ignored. Needs JOBS_ENABLED=true on the API pods (see `jobs.enabled`).
  docling:
    enabled: false
    image:
      repository: ghcr.io/janschachtschabel/text-extraction-docling
      # Defaults to image.tag, then the chart appVersion. The pull policy is image.pullPolicy.
      tag: ""
    replicaCount: 1
    # Documents one pod converts at once, each in a child process of its own
    # (DOCLING_CONCURRENCY). Rendered into the pod env: a config.DOCLING_CONCURRENCY entry is
    # ignored. The resources below are sized for one.
    concurrency: 1
    # No drain wait. On SIGTERM the worker stops claiming and gives conversions in flight 30 s,
    # then kills its children; their items run again elsewhere once their lease expires. The render
    # fails below 30 + a 10 s margin.
    terminationGracePeriodSeconds: 60
    # Placeholder values until package 11 measures real consumption: one conversion child with the
    # layout and table models (DOCLING_MEMORY_LIMIT_MB 6144 of address space) and DOCLING_THREADS
    # (4) threads.
    resources:
      requests:
        cpu: "1"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 8Gi
    # Merged over the global `nodeSelector` for these pods; a key set here wins. The Docling image
    # is built for linux/amd64 only.
    nodeSelector:
      kubernetes.io/arch: amd64
    # As for the extract workers. KEDA reads the pool `docling` gauges that API pods export with
    # JOBS_ENABLED=true and DOCLING_ENABLED=true. With no replica, sync requests answer without OCR
    # (`ocr_unavailable`) after DOCLING_SYNC_WAIT_SECONDS and batch items wait in the queue.
    autoscaling:
      keda:
        enabled: false
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        # Pending queue items per worker replica (a conversion takes up to minutes).
        threshold: 4
        minReplicaCount: 1
        maxReplicaCount: 4
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
    # The models (Docling's layout and table models, Tesseract's data; 9 files, about 335 MiB)
    # live on a volume mounted at /models (DOCLING_MODELS_PATH, set by the chart). The image
    # holds none.
    models:
      # An init container runs `text-extraction-docling-worker --download-models` with the
      # volume mounted writable: it downloads the files of the manifest, checks their SHA-256 and
      # does nothing when they are in place. Needs egress to raw.githubusercontent.com and
      # huggingface.co. false: for an air-gapped, pre-filled volume (`persistence.existingClaim`,
      # required then). The worker mounts the volume read-only either way.
      download: true
      # When the download runs: `init` (an init container of every worker pod; works with
      # ReadWriteOnce) or `job` (a Helm post-install/post-upgrade hook Job fills the volume once
      # per release, and worker pods only check the marker; needs ReadWriteMany or one node). With
      # `job`, a worker pod that starts before the Job finished exits with code 1 and restarts
      # until the models are there; `helm install --wait` waits for the workers before it runs
      # the hook, so install the first release without --wait or use `init`.
      downloadMode: init
      # Of the init container or the hook Job: the download streams each file to the volume and
      # hashes it on the way, so it needs little memory (not the worker's resources).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        # The models take about 335 MiB; a changed manifest stages a full copy beside the old
        # one (about 670 MiB at once). 5Gi leaves room for later models; 1Gi suffices today.
        size: 5Gi
        # ReadWriteMany lets replicas on any node share one volume. With ReadWriteOnce keep the
        # replicas on one node (or at 1). The volume must be writable by uid/gid 10001 (fsGroup).
        accessModes:
          - ReadWriteMany
        # The cluster default when empty.
        storageClass: ""
        # Use this PVC instead of creating one.
        existingClaim: ""

  # ASR workers (transcription, ruling M12: off by default): they claim the items of the pool
  # `asr` (`transcribe: true` on media without subtitles, uploaded audio and video) and transcribe
  # them with faster-whisper on the CPU, or on an external OpenAI-compatible endpoint
  # (`backend: openai`). Image `workers.asr.image` (PyAV built against an LGPL FFmpeg, no
  # `ffmpeg` program, no models), internal port 9090 only, no ingress, same ConfigMap and Secrets
  # as the API pods. The chart renders ASR_ENABLED from `enabled`, ASR_BACKEND from `backend` and
  # MEDIA_UPLOAD_MAX_BYTES from `uploadMaxBytes` into every pod (API, extract, browser, Docling
  # and ASR workers): config.* entries for them are ignored. Needs JOBS_ENABLED=true on the API
  # pods (see `jobs.enabled`). Nothing waits for a transcription (it is always a job), so the API
  # pods' grace period does not change.
  # The length limits of decision D6 are service defaults, set in `config` to change them:
  # MEDIA_MAX_DURATION_SECONDS (7200), ASR_TIMEOUT_SECONDS (10800, one whole item) and
  # ASR_INPUT_TTL_SECONDS (28800). The render fails when the input TTL does not outlast the lease
  # (2 x ASR_TIMEOUT_SECONDS + 10), as the service would at start-up.
  asr:
    enabled: false
    # `local` (faster-whisper with the model from the volume) or `openai` (the endpoint in
    # `external`; no models volume, no download).
    backend: local
    # Whisper model of the local backend (ASR_MODEL): `large-v3-turbo` (about 1.6 GB, better
    # German) or `small` (about 0.5 GB, about twice as fast on CPU). Only this one is downloaded.
    model: large-v3-turbo
    image:
      repository: ghcr.io/janschachtschabel/text-extraction-asr
      # Defaults to image.tag, then the chart appVersion. The pull policy is image.pullPolicy.
      tag: ""
    replicaCount: 1
    # Transcriptions one pod runs at once, each in a child process of its own (ASR_CONCURRENCY).
    # Rendered into the pod env: a config.ASR_CONCURRENCY entry is ignored. The resources and the
    # scratch volume below are sized for one.
    concurrency: 1
    # Largest uploaded audio or video file (MEDIA_UPLOAD_MAX_BYTES, decision D3), in bytes. The
    # bytes travel through Valkey and count in DOCLING_INPUT_BUDGET_BYTES (200000000), which it
    # must not exceed (the render fails). Larger media: send the URL.
    uploadMaxBytes: 25000000
    # No drain wait. On SIGTERM the worker stops claiming and gives transcriptions in flight 30 s,
    # then kills its children and gives their items back to the queue at once (attempts + 1):
    # another replica transcribes them again from the start (a transcription of an hour is not
    # waited for). The render fails below 30 + a 10 s margin. A scale-down, a rolling update or a
    # node drain thus interrupts the transcriptions in flight; see `autoscaling`.
    terminationGracePeriodSeconds: 60
    # Placeholder values until package 11 measures real consumption: one child with
    # `large-v3-turbo` (about 2 GB resident, ASR_MEMORY_LIMIT_MB 4096 of address space) and
    # ASR_THREADS (4) threads. Raise both with `concurrency`.
    resources:
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 6Gi
    # Downloaded media (ASR_SCRATCH_PATH=/scratch): an emptyDir per pod, deleted after each item.
    # concurrency x (MEDIA_MAX_BYTES (500000000) + 5 MB) must fit, or the render fails.
    scratch:
      sizeLimit: 2Gi
    # /tmp of the worker and its init container (HOME, caches of the libraries): small files only.
    tmpSizeLimit: 1Gi
    # Merged over the global `nodeSelector` for these pods; a key set here wins. The ASR image is
    # published for linux/amd64.
    nodeSelector:
      kubernetes.io/arch: amd64
    # As for the extract workers. KEDA reads the pool `asr` gauges that API pods export with
    # JOBS_ENABLED=true and ASR_ENABLED=true. With no replica, transcriptions wait in the queue
    # (up to ASR_INPUT_TTL_SECONDS for an upload's bytes).
    # Removing a replica interrupts its transcriptions: they go back to the queue and start again
    # elsewhere (with `backend: openai` the endpoint bills them again), and Kubernetes does not
    # pick the idle pod. For steady load prefer fixed replicas (both scalers off, `replicaCount`);
    # with a scaler, KEDA counts the items in flight too and both wait an hour of lower load
    # before they scale down.
    autoscaling:
      keda:
        enabled: false
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        # Pending plus leased queue items per worker replica. null: `concurrency`, a replica for
        # every `concurrency` transcriptions queued or in flight.
        threshold: null
        countLeased: true
        minReplicaCount: 1
        maxReplicaCount: 4
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
      # The Kubernetes maximum: an hour of lower load before a replica is removed.
      scaleDownStabilizationWindowSeconds: 3600
    # The Whisper model (local backend only) lives on a volume mounted at /models
    # (ASR_MODELS_PATH, set by the chart), read-only in the workers. The image holds none.
    models:
      # Downloads `model` from huggingface.co (pinned commits, SHA-256 checked) with the volume
      # mounted writable; does nothing when it is in place. false: for an air-gapped, pre-filled
      # volume (`persistence.existingClaim`, required then).
      download: true
      # `init` or `job`, as for the Docling workers.
      downloadMode: init
      # Of the init container or the hook Job, as for the Docling workers.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        # `large-v3-turbo` takes about 1.6 GiB; an update stages a full copy beside it.
        size: 4Gi
        # ReadWriteMany lets replicas on any node share one volume. With ReadWriteOnce keep the
        # replicas on one node (or at 1). The volume must be writable by uid/gid 10001 (fsGroup).
        accessModes:
          - ReadWriteMany
        # The cluster default when empty.
        storageClass: ""
        # Use this PVC instead of creating one.
        existingClaim: ""
    # The external OpenAI-compatible endpoint (`backend: openai`), called directly by the ASR
    # workers (egress stays open; see networkPolicy).
    external:
      # Base URL (https only) of `<baseUrl>/audio/transcriptions` (ASR_EXTERNAL_BASE_URL).
      # Required with `backend: openai`.
      baseUrl: ""
      # ASR_EXTERNAL_MODEL.
      model: whisper-1
      # ASR_EXTERNAL_API_KEY, optional: without it callers must send their own key
      # (X-ASR-Api-Key). Set `apiKey` for a chart-managed Secret, or point `existingSecret` at your
      # own Secret. The API pods get it too (only to answer 400 when there is no key at all).
      apiKey: ""
      existingSecret: ""
      # Key inside the existing Secret (the chart-managed one uses it as well).
      existingSecretKey: ASR_EXTERNAL_API_KEY

  # NLP workers (PII, package 7: off by default): they claim the items of the pool `nlp` (results of
  # requests with `pii`) and find and replace personal data with Presidio and spaCy. Image
  # `workers.nlp.image` (Presidio and spaCy, no models), internal port 9090 only, no ingress, same
  # ConfigMap and Secrets as the API pods. The chart renders PII_ENABLED from `enabled` into every
  # pod (API, extract, browser, Docling, ASR and NLP workers): a config.PII_ENABLED entry is
  # ignored. Needs JOBS_ENABLED=true on the API pods (see `jobs.enabled`). Without a worker a
  # request with `pii` answers 400 (PII off). PII_SYNC_WAIT_SECONDS (20), PII_TIMEOUT_SECONDS
  # (300) and the other PII settings of docs/configuration.md are service defaults: set them in
  # `config` to change them.
  nlp:
    enabled: false
    # The spaCy models (PII_MODEL_SIZE): `lg` (about 1 GB on the volume, 1.6 GB resident, better
    # German names) or `md` (about 115 MB, half the memory, more names missed). Only the German
    # and English models of this size are downloaded.
    modelSize: lg
    image:
      repository: ghcr.io/janschachtschabel/text-extraction-nlp
      # Defaults to image.tag, then the chart appVersion. The pull policy is image.pullPolicy.
      tag: ""
    replicaCount: 1
    # Results one pod analyses at once, each in a child process of its own with the models loaded
    # (PII_CONCURRENCY). Rendered into the pod env: a config.PII_CONCURRENCY entry is ignored. The
    # resources below are sized for one.
    concurrency: 1
    # No drain wait. On SIGTERM the worker stops claiming and gives analyses in flight 30 s, then
    # kills its children; their items run again elsewhere once their lease expires. The render
    # fails below 30 + a 10 s margin.
    terminationGracePeriodSeconds: 60
    # Placeholder values until package 11 measures real consumption: one child with the `lg`
    # models (about 1.6 GB resident, 2.2 GB peak on a long text; PII_MEMORY_LIMIT_MB 3072 of
    # address space). `md` needs about half. Raise both with `concurrency`.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 3Gi
    # Merged over the global `nodeSelector` for these pods; a key set here wins.
    nodeSelector: {}
    # As for the extract workers. KEDA reads the pool `nlp` gauges that API pods export with
    # JOBS_ENABLED=true and PII_ENABLED=true. Keep at least one replica: a sync request with
    # `pii` waits only PII_SYNC_WAIT_SECONDS (20) for a worker before it becomes a job.
    autoscaling:
      keda:
        enabled: false
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        # Pending queue items per worker replica (an analysis takes seconds).
        threshold: 10
        countLeased: false
        minReplicaCount: 1
        maxReplicaCount: 4
      hpa:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 70
      scaleDownStabilizationWindowSeconds: null
    # PII_HASH_KEY, the key of `mode: hash` (at least 32 bytes, `openssl rand -hex 32`), from a
    # Secret of your own. Only the NLP workers read it. Without it each result is hashed with a
    # random key (`hash_scope: result`); with it the same value gets the same hash in every result
    # (`hash_scope: service`). Changing it changes every hash.
    hashKey:
      existingSecret: ""
      # Key inside the existing Secret.
      existingSecretKey: PII_HASH_KEY
    # The spaCy models (PII_MODELS_PATH=/models, set by the chart) live on a volume mounted
    # read-only in the workers. The image holds none.
    models:
      # An init container runs `text-extraction-nlp-worker --download-models` with the volume
      # mounted writable: it downloads the German and English models of `modelSize` from the
      # explosion/spacy-models GitHub releases, checks their SHA-256 and does nothing when they
      # are in place. Needs egress to github.com and githubusercontent.com (the releases redirect
      # there). false: for an air-gapped, pre-filled volume (`persistence.existingClaim`, required
      # then).
      download: true
      # `init` or `job`, as for the Docling workers.
      downloadMode: init
      # Of the init container or the hook Job, as for the Docling workers.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        # `lg` takes about 1.1 GB, `md` about 0.2 GB; switching the size adds the other pair.
        size: 2Gi
        # ReadWriteMany lets replicas on any node share one volume. With ReadWriteOnce keep the
        # replicas on one node (or at 1). The volume must be writable by uid/gid 10001 (fsGroup).
        accessModes:
          - ReadWriteMany
        # The cluster default when empty.
        storageClass: ""
        # Use this PVC instead of creating one.
        existingClaim: ""

service:
  type: ClusterIP
  # Public API port. The ingress targets this port only.
  port: 8080

# The ingress exposes the public Service (port `http`, 8080) only.
# The internal port 9090 (/health, /ready, /metrics) is never routed through it.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: text-extraction.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Single-replica Valkey for rate limits, the result cache, jobs and the job queue.
# Switch it off and set `externalValkey` to use a managed or shared Valkey/Redis.
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8.1-alpine
    pullPolicy: IfNotPresent
  auth:
    # Valkey requires a password. API and worker pods get VALKEY_PASSWORD from the Secret and
    # VALKEY_URL=redis://:$(VALKEY_PASSWORD)@<valkey>:6379/0 through Kubernetes env expansion.
    enabled: true
    # Name of your own Secret with the password. Without it the chart creates a Secret with a
    # random 32-character alphanumeric password and keeps it across upgrades (lookup). Helm
    # renders without a cluster (helm template, GitOps renderers) cannot look it up and would
    # generate a new password on every render: use an existing Secret there.
    # The password goes into a URL and is also what Valkey expects, verbatim. It must therefore be
    # URL-safe: letters, digits and - . _ ~ only (for example `openssl rand -hex 24`). Do not
    # percent-encode it: the client decodes %XX in the URL but Valkey would compare the encoded text.
    existingSecret: ""
    # Key inside the Secret (the chart-managed one uses it as well).
    existingSecretKey: VALKEY_PASSWORD
  # Memory Valkey may use for data (--maxmemory). The eviction policy is fixed to noeviction:
  # jobs, queue and counters must never be evicted, a full Valkey refuses writes instead.
  # 768mb is 60 % of the 1280Mi memory limit: maxmemory counts the data only, and the rest is for
  # allocator fragmentation, client and replication buffers and the copy-on-write pages of the
  # fork of an append-only-file rewrite or a background save. Keep it near 60 % of the limit.
  # Sizing: job results are the bulk, about BATCH_MAX_URLS x the average result JSON per open
  # batch (1,000 x ~80 KB = ~80 MB), plus as much again in the result cache, held for
  # JOB_TTL_SECONDS / RESULT_STORE_TTL_SECONDS (24 h). Documents queued for OCR (Docling workers)
  # and slow uploads keep their bytes here too, at most DOCLING_INPUT_BUDGET_BYTES (200 MB) in all
  # (up to DOCLING_INPUT_TTL_SECONDS each): 80 + 80 + 200 MB fit below 80 % of 768mb, larger
  # batches or a larger budget do not. At VALKEY_MEMORY_GUARD_RATIO (0.8) of maxmemory the API
  # stops accepting batches (503), all pods skip result-cache writes and nothing more is queued
  # for OCR, so plan maxmemory for the batches and documents you expect at once with room to
  # spare below 80 %.
  maxmemory: 768mb
  persistence:
    # false: data lives in an emptyDir and is lost on restart (jobs and queued items are lost too).
    enabled: false
    size: 1Gi
    storageClass: ""
    existingClaim: ""
  # Requests equal limits (Guaranteed QoS): Valkey holds all shared state, so the node must
  # never evict it for memory pressure, and a request below the limit would let it grow into
  # memory other pods need. Reserves 1.25Gi and half a CPU per release. Raise the memory limit
  # and maxmemory together (60 %).
  resources:
    requests:
      cpu: 500m
      memory: 1280Mi
    limits:
      cpu: 500m
      memory: 1280Mi

# Used when valkey.enabled is false.
externalValkey:
  # Plain URL, for example redis://valkey.example.org:6379/0. Do not put a password here.
  url: ""
  # For a URL that carries a password, reference a Secret instead. It takes precedence over `url`.
  # The Secret holds the whole URL, so a password with reserved characters must be percent-encoded
  # there (redis://:p%40ss@host:6379/0 means the password p@ss).
  existingSecret:
    name: ""
    key: VALKEY_URL

metrics:
  # Needs the Prometheus Operator CRDs. Scrapes the internal Services of the API pods and of the
  # workers (extract, browser, docling, asr, nlp), port `internal`, path /metrics.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, for example the `release` label that your Prometheus selects on.
    labels: {}
  # Needs the Prometheus Operator CRDs and kube-state-metrics (for TextExtractionDown and
  # TextExtractionWorkersDown). The job alerts need the ServiceMonitor and JOBS_ENABLED=true.
  prometheusRule:
    enabled: false
    labels: {}

# Thresholds of the alerts in metrics.prometheusRule.
alerts:
  # TextExtractionQueueBacklog fires above this many pending items of a pool (extract, browser)
  # while no item of that pool completes.
  queueBacklogItems: 1000
  # The same for the pool docling, whose items take minutes each.
  doclingQueueBacklogItems: 100
  # The same for the pool asr, whose items take up to hours.
  asrQueueBacklogItems: 50
  # The same for the pool nlp, whose items take seconds.
  nlpQueueBacklogItems: 200
  # TextExtractionValkeyMemoryHigh fires while Valkey's used memory stays above this share of
  # its maxmemory for 10 minutes. Keep it at or below config.VALKEY_MEMORY_GUARD_RATIO (0.8),
  # from which the API refuses new batches.
  valkeyMemoryRatio: 0.8

# Restricts who may reach the pods (needs a CNI that enforces NetworkPolicy). Only ingress is
# limited: the API must reach arbitrary sites, so egress stays open (it also covers the model
# downloads from huggingface.co, github.com (and githubusercontent.com) and the external ASR endpoint).
#   Valkey   accepts 6379 from the API and worker pods (extract, browser, docling, asr, nlp) of
#            this release only.
#   API      accepts 8080 from anywhere and 9090 from `metricsFrom`.
#   Workers  (extract, browser, docling, asr, nlp) accept 9090 from `metricsFrom` only.
# Probes of the kubelet run from the node and are normally allowed by the CNI.
networkPolicy:
  enabled: false
  # Peers (NetworkPolicy `from` entries) allowed to scrape port 9090: Prometheus. The default is
  # every pod of the release namespace. Example for Prometheus in another namespace:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
  # An empty list lets nobody reach 9090.
  metricsFrom:
    - podSelector: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
