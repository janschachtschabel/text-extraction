[project]
name = "text-extraction"
version = "0.1.0"
description = "API service that extracts text and Markdown from web pages, files, audio and video."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "defusedxml>=0.7.1",
    "extruct>=0.18.0",
    "fastapi>=0.162.0",
    "httpcore>=1.0.9",
    "httpx[http2]>=0.28.1",
    "jstyleson>=0.0.2",
    "lxml>=6.1.3",
    "markdown-it-py==4.2.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.8",
    "numpy>=2.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "protego>=0.7.0",
    "py3langid>=0.4.0",
    "pydantic-settings>=2.16.1",
    # Newest release at least 14 days old when added (supply-chain caution, as for patchright).
    "pypdfium2==5.14.0",
    "python-multipart==0.0.32",  # Apache-2.0; 14-day rule as above
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "trafilatura>=1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
text-extraction = "text_extraction.server:main"
text-extraction-worker = "text_extraction.worker:main"
text-extraction-browser-worker = "text_extraction.browser_worker:main"

[project.optional-dependencies]
browser = [
    "duckduckgo-autoconsent-py>=16",
    # Pinned to a release at least 14 days old (supply-chain caution, ruling R16).
    "patchright==1.63.0",
    "playwright>=1.64",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "fakeredis[lua]>=2.40.0",
    "httpx2>=2.16.0",
    "pytest-httpserver>=1.2.0",
    "playwright>=1.64",
    "patchright==1.63.0",  # as in the extra `browser`
    "duckduckgo-autoconsent-py>=16",
    # Build the document corpus in tests/documents (dev only), 14-day rule as above.
    "reportlab==5.0.1",
    "python-docx==1.2.0",
    "pillow==12.3.0",
    "xlwt==1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "duckduckgo_autoconsent", "extruct.*", "jstyleson", "lxml.*", "openpyxl.*", "py3langid.*", "pypdfium2.*", "reportlab.*", "xlwt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/live needs a running service and the internet: only run_live.py runs it, by hand or in CI.
# tests/e2e starts its own processes: only run_batch.py runs it (.github/workflows/e2e.yml).
# Browser tests need Chromium: `pytest -m browser` runs them (CI job `browser`).
addopts = "-ra --strict-markers --strict-config --ignore=tests/live --ignore=tests/e2e -m 'not browser'"
markers = ["browser: needs a real Chromium (run with `-m browser`)"]
xfail_strict = true
