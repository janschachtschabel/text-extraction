[project]
name = "text-extraction"
version = "0.1.0"
description = "API service that extracts text and Markdown from web pages, files, audio and video."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "defusedxml>=0.7.1",
    "extruct>=0.18.0",
    "fastapi>=0.162.0",
    "httpcore>=1.0.9",
    "httpx[http2]>=0.28.1",
    "jstyleson>=0.0.2",
    "lxml>=6.1.3",
    "markdown-it-py==4.2.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.8",
    "numpy>=2.0",
    # The OpenAI-compatible LLM client (structured output, semantic chunking) and, since
    # package 8, the external ASR backend. Both pins are older than 14 days (ruling R16).
    "openai==3.29.0",  # Apache-2.0
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "protego>=0.7.0",
    "py3langid>=0.4.0",
    "pydantic-settings>=2.16.1",
    # Newest release at least 14 days old when added (supply-chain caution, as for patchright).
    "pypdfium2==5.14.0",
    "python-multipart==0.0.32",  # Apache-2.0; 14-day rule as above
    "redis>=8.1.0",
    # Patterns of structured output run with a timeout, which the standard `re` cannot give.
    "regex==2026.9.29",  # Apache-2.0; 14-day rule as above
    "structlog>=26.1.0",
    "trafilatura>=1.8",
    "uvicorn[standard]>=0.54.0",
    # Subtitles and metadata of media platforms, imported in media child processes only. yt-dlp
    # without its extra `default`: that extra pulls in mutagen (GPL-2.0-or-later, CLAUDE.md rule
    # 7) and yt-dlp-ejs (only of use with a JavaScript runtime, which the API image has none of);
    # requests is its HTTP handler and youtube-transcript-api's session. Newest releases at
    # least 14 days old when added.
    "requests>=2.32.2",
    "youtube-transcript-api==1.2.4",  # MIT
    "yt-dlp==2026.8.19",  # Unlicense
]

[project.scripts]
text-extraction = "text_extraction.server:main"
text-extraction-worker = "text_extraction.worker:main"
text-extraction-browser-worker = "text_extraction.browser_worker:main"
text-extraction-docling-worker = "text_extraction.docling_worker:main"
text-extraction-asr-worker = "text_extraction.asr_worker:main"
text-extraction-nlp-worker = "text_extraction.nlp_worker:main"

[project.optional-dependencies]
browser = [
    "duckduckgo-autoconsent-py>=16",
    # Pinned to a release at least 14 days old (supply-chain caution, ruling R16).
    "patchright==1.63.0",
    "playwright>=1.64",
]
# The Docling worker (text-extraction-docling-worker): Docling with only the parts it uses (PDF and
# image pipeline, OpenDocument, local layout and table models), and torch and torchvision from the
# PyTorch CPU index (no CUDA). Each pinned to a release at least 14 days old (ruling R16).
docling = [
    "docling-slim[convert-core,format-pdf,format-opendocument,models-local]==2.137.0",
    # TableFormer (docling-ibm-models) imports cv2 but leaves OpenCV to an extra of its own.
    "opencv-python-headless==4.14.0.94",
    "torch==2.14.1",
    "torchvision==0.29.1",
]
# The ASR worker (text-extraction-asr-worker): faster-whisper on CTranslate2, PyAV to decode the
# media (its children pass faster-whisper a float32 array, never a path), and yt-dlp with Deno
# for YouTube's player challenges when it downloads audio. yt-dlp-ejs (the challenge solver
# scripts, so no remote components are fetched) is pinned to what yt-dlp 2026.8.19 asks for; never
# yt-dlp's extra `default` (mutagen is GPL-2.0-or-later). The ASR image builds PyAV from source
# against an LGPL FFmpeg (decision D5): the PyPI wheel of av bundles libx264 and libx265 (GPL),
# so the worker's --check refuses it; it serves local development and tests only. The OpenAI SDK
# (ASR_BACKEND=openai, imported in the children only) is a base dependency since package 8. Each
# pinned to a release at least 14 days old (ruling R16).
asr = [
    "av==19.0.1",  # BSD-3-Clause
    "ctranslate2==4.8.2",  # MIT
    "deno==2.9.7",  # MIT
    "faster-whisper==1.2.1",  # MIT
    "yt-dlp[deno]==2026.8.19",  # Unlicense
    "yt-dlp-ejs==0.8.0",  # Unlicense AND MIT AND ISC
]

# The NLP worker (text-extraction-nlp-worker): Presidio and spaCy, imported in its child processes
# only (never in the API, the other workers or the nlp worker's parent). The spaCy models are not
# a Python dependency: they come from the manifest `pii/models.toml` onto the volume. Presidio's
# transitive packages are not pinned here (tldextract ships the public suffix list the e-mail
# recognizer uses offline); thinc 8.3.14 (2026-10-25) is held back by `exclude-newer-package`.
# Each pinned to a release at least 14 days old (ruling R16).
nlp = [
    "presidio-analyzer==2.2.364",  # MIT; 2.2.365 (2026-10-25) is too new
    "spacy==3.8.16",  # MIT
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The 14-day rule (CONTRIBUTING.md) for transitive packages that uv.lock holds back: a later
# `uv lock --upgrade` takes only their releases that are at least 14 days old. A relative span
# does not outdate the lock as time passes; it is re-evaluated when uv resolves again.
exclude-newer-package = { thinc = "14 days", blis = "14 days", confection = "14 days", cymem = "14 days", murmurhash = "14 days", phonenumbers = "14 days", preshed = "14 days", smart-open = "14 days", srsly = "14 days", weasel = "14 days", wrapt = "14 days", pandas = "14 days", pycparser = "14 days", xlsxwriter = "14 days", docling-core = "14 days", docling-parse = "14 days", docling-ibm-models = "14 days", odfdo = "14 days", transformers = "14 days", doclang = "14 days", pluggy = "14 days", setuptools = "14 days", jiter = "14 days" }

# torch and torchvision only from the PyTorch CPU index: its wheels carry no CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "fakeredis[lua]>=2.40.0",
    "httpx2>=2.16.0",
    "pytest-httpserver>=1.2.0",
    "playwright>=1.64",
    "patchright==1.63.0",  # as in the extra `browser`
    "duckduckgo-autoconsent-py>=16",
    # Build the document corpus in tests/documents (dev only), 14-day rule as above.
    "reportlab==5.0.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",  # also in markitdown's extras
    "openpyxl==3.1.5",  # also in markitdown's extras
    "pillow==12.3.0",
    "xlwt==1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["av.*", "defusedxml.*", "deno.*", "docling.*", "docling_core.*", "duckduckgo_autoconsent", "extruct.*", "faster_whisper.*", "jstyleson", "lxml.*", "openpyxl.*", "presidio_analyzer.*", "py3langid.*", "pypdfium2.*", "reportlab.*", "spacy.*", "tldextract.*", "xlwt.*", "yt_dlp.*"]
ignore_missing_imports = true

# Presidio's classes are Any where the extra `nlp` is not installed (the default environment type-
# checks without it); subclassing them is the point of this module.
[[tool.mypy.overrides]]
module = ["text_extraction.pii.recognizers"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/live needs a running service and the internet: only run_live.py runs it, by hand or in CI.
# tests/e2e starts its own processes: only run_batch.py runs it (.github/workflows/e2e.yml).
# Browser tests need Chromium: `pytest -m browser` runs them (CI job `browser`).
# Docling tests need the extra `docling`, Tesseract and the models: `pytest -m docling`.
# ASR tests need the extra `asr` and a Whisper model under ASR_MODELS_PATH: `pytest -m asr`.
# NLP tests need the extra `nlp` and download the spaCy models of PII_TEST_MODEL_SIZE (default
# md) into PII_TEST_MODELS_PATH: `pytest -m nlp`.
addopts = "-ra --strict-markers --strict-config --ignore=tests/live --ignore=tests/e2e -m 'not browser and not docling and not asr and not nlp'"
markers = [
    "browser: needs a real Chromium (run with `-m browser`)",
    "docling: needs Docling, Tesseract and the models (run with `-m docling`)",
    "asr: needs the extra `asr` and a Whisper model under ASR_MODELS_PATH (run with `-m asr`)",
    "nlp: needs the extra `nlp` and the spaCy models, downloaded on first use (run with `-m nlp`)",
]
xfail_strict = true
