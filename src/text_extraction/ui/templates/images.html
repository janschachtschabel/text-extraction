<div class="preview-grid">
  {% for entry in previews %}
  <figure class="preview" data-url="{{ entry.url }}">
    {% if entry.data_uri %}<img src="{{ entry.data_uri }}" alt="{{ entry.alt }}">{% else %}{% set skipped_reason %}<span class="skipped">{{ entry.skipped }}</span>{% endset %}<p class="skipped-line">{{ t("result.preview_skipped", reason=skipped_reason) }}</p>{% endif %}
    <figcaption>{{ entry.alt }}</figcaption>
  </figure>
  {% endfor %}
</div>
