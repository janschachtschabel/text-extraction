<form class="op" hx-post="/ui/run/chunk" hx-target="#result" hx-swap="innerHTML" hx-encoding="multipart/form-data">
  {% set prefix = "chunk" %}
  {% set default_chunking = '{"strategy": "recursive", "size": 800}' %}
  <p class="hint">{{ t("form.url_or_text") }}</p>
  <label for="chunk-url">URL</label>
  <input id="chunk-url" name="url" type="url" placeholder="https://" spellcheck="false">
  {% include "forms/access.html" %}
  <label for="chunk-text">{{ t("form.text") }}</label>
  <textarea id="chunk-text" name="text" rows="6"></textarea>
  <label for="chunk-text-type">{{ t("form.text_is") }}</label>
  <select id="chunk-text-type" name="text_type">
    <option value="markdown" selected>{{ t("form.format_markdown") }}</option>
    <option value="plain">{{ t("form.plain_text") }}</option>
  </select>
  {% include "forms/format.html" %}
  <label for="chunk-chunking">{{ t("form.chunking") }}</label>
  <textarea id="chunk-chunking" name="chunking" rows="3" spellcheck="false" required>{{ default_chunking }}</textarea>
  {% include "forms/common.html" %}
  <button type="submit">{{ t("form.chunk") }}</button>
</form>
