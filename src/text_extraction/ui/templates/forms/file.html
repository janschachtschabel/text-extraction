<form class="op" hx-post="/ui/run/file" hx-target="#result" hx-swap="innerHTML" hx-encoding="multipart/form-data">
  {% set prefix = "file" %}
  <label for="file-file">{{ t("form.file") }}</label>
  <input id="file-file" name="file" type="file" required>
  {% include "forms/format.html" %}
  <fieldset class="choice">
    <legend>{{ t("form.also") }}</legend>
    <label class="inline"><input type="checkbox" name="metadata" value="on" checked> {{ t("form.metadata") }}</label>
  </fieldset>
  {% include "forms/common.html" %}
  <button type="submit">{{ t("form.extract_file") }}</button>
</form>
