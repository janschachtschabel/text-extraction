<label for="{{ prefix }}-wait">Wait seconds before it becomes a job</label>
<input id="{{ prefix }}-wait" name="wait_seconds" type="number" min="0" max="60" step="any" value="25">
<label for="{{ prefix }}-options">Options (JSON)</label>
<textarea id="{{ prefix }}-options" name="options" rows="3" spellcheck="false" placeholder='{"links": true}'></textarea>
<p class="hint">Any further field of the REST body, merged under the fields above; a field left at its default yields to the same key here.</p>
