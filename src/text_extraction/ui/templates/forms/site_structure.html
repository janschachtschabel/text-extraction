<form class="op" hx-post="/ui/run/site-structure" hx-target="#result" hx-swap="innerHTML">
  {% set prefix = "site" %}
  <label for="site-url">{{ t("form.start_url") }}</label>
  <input id="site-url" name="url" type="url" required placeholder="https://" spellcheck="false">
  <label for="site-depth">{{ t("form.depth") }}</label>
  <input id="site-depth" name="depth" type="number" min="0" max="10" value="2">
  <label for="site-max-pages">{{ t("form.max_pages") }}</label>
  <input id="site-max-pages" name="max_pages" type="number" min="1" value="100">
  <label for="site-scope">{{ t("form.scope") }}</label>
  <select id="site-scope" name="scope">
    <option value="host" selected>{{ t("form.scope_host") }}</option>
    <option value="path">{{ t("form.scope_path") }}</option>
  </select>
  <fieldset class="choice">
    <legend>{{ t("form.also") }}</legend>
    <label class="inline"><input type="checkbox" name="sitemaps" value="on" checked> {{ t("form.sitemaps") }}</label>
  </fieldset>
  {% set access_site = true %}
  {% include "forms/access.html" %}
  {% include "forms/options.html" %}
  <button type="submit">{{ t("form.read_site") }}</button>
</form>
