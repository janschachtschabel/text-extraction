<form class="op" hx-post="/ui/run/extract" hx-target="#result" hx-swap="innerHTML">
  {% set prefix = "extract" %}
  <label for="extract-url">URL</label>
  <input id="extract-url" name="url" type="url" required placeholder="https://" spellcheck="false">
  {% include "forms/format.html" %}
  {% include "forms/mode.html" %}
  {% include "forms/access.html" %}
  <fieldset class="choice">
    <legend>{{ t("form.also") }}</legend>
    <label class="inline"><input type="checkbox" name="metadata" value="on" checked> {{ t("form.metadata") }}</label>
    <label class="inline"><input type="checkbox" name="metadata_structured" value="on"> {{ t("form.metadata_structured") }}</label>
    <label class="inline"><input type="checkbox" name="describe_images" value="on"> {{ t("form.describe_images") }}</label>
  </fieldset>
  <label for="extract-max-images">{{ t("form.max_images") }}</label>
  <input id="extract-max-images" name="max_images" type="number" min="1" max="20" value="5">
  {% include "forms/common.html" %}
  <button type="submit">{{ t("form.extract") }}</button>
</form>
