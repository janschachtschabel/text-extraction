{% set prefix = "batch" %}
<form id="batch-form" class="op" hx-post="/ui/run/batch-urls" hx-target="#result" hx-swap="innerHTML">
  <label for="batch-urls">{{ t("form.urls_per_line") }}</label>
  <textarea id="batch-urls" name="urls" rows="8" spellcheck="false" required placeholder="https://" aria-describedby="batch-urls-hint"></textarea>
  <p class="hint" id="batch-urls-hint">{{ t("hint.urls", setting=code("BATCH_MAX_URLS")) }}</p>
  {% include "forms/batch_options.html" %}
  <button type="submit">{{ t("batch.start") }}</button>
</form>
