<form class="op" hx-post="/ui/run/batch-urls" hx-target="#result" hx-swap="innerHTML">
  {% set prefix = "batch" %}
  <label for="batch-urls">{{ t("form.urls_per_line") }}</label>
  <textarea id="batch-urls" name="urls" rows="8" spellcheck="false" required placeholder="https://"></textarea>
  <p class="hint">{{ t("form.batch_hint", setting=code("BATCH_MAX_URLS")) }}</p>
  {% include "forms/batch_options.html" %}
  <button type="submit">{{ t("batch.start") }}</button>
</form>
