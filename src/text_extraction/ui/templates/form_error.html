<div class="error" role="alert">
  <p>{{ t(message) }}</p>
  {% if problems %}
  <ul class="problems">
    {% for row, reason in problems %}<li>{{ t("batch.row_problem", row=row, reason=reason) }}</li>{% endfor %}
  </ul>
  {% if more_problems %}<p class="hint">{{ t("batch.more_problems", count=more_problems) }}</p>{% endif %}
  {% endif %}
</div>
