<section class="jobs-view" aria-label="{{ t('progress.jobs') }}">
  {% if refused %}
  <div class="error" role="alert">
    <p>{{ t("progress.part_refused", part=refused.part, parts=refused.parts, status=refused.http_status, message=refused.message) }}</p>
    <p class="hint">{{ t("progress.keep_running") }}</p>
  </div>
  {% endif %}
  {% include "progress_live.html" %}
  <div class="job-detail" aria-live="polite"></div>
</section>
