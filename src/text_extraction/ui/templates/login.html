<section class="login" aria-labelledby="login-title">
  {% include "language_switch.html" %}
  <form id="login-form" autocomplete="off">
    <h2 id="login-title">{{ t("login.title") }}</h2>
    <p>{{ t("login.intro") }}</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <label for="login-api-key">{{ t("login.api_key") }}</label>
    <input id="login-api-key" type="password" autocomplete="off" spellcheck="false" required>
    <details>
      <summary>{{ t("keys.optional") }}</summary>
      <label for="login-llm-key">{{ t("keys.llm", header=code("X-LLM-Api-Key")) }}</label>
      <input id="login-llm-key" type="password" autocomplete="off" spellcheck="false">
      <label for="login-asr-key">{{ t("keys.asr", header=code("X-ASR-Api-Key")) }}</label>
      <input id="login-asr-key" type="password" autocomplete="off" spellcheck="false">
    </details>
    <button type="submit">{{ t("login.submit") }}</button>
  </form>
</section>
