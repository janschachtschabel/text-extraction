# SearXNG settings of the text-extraction stack (package 25). SearXNG runs as its own, unmodified
# container (searxng/searxng, AGPL-3.0) and answers only the API's JSON requests.
#
# text-extraction-init renders this file into the volume searxng-config (settings.yml) on every
# start, with the placeholder secret_key replaced by a generated key it keeps; the Helm chart mounts
# it from a ConfigMap and sets the key through SEARXNG_SECRET. SearXNG refuses to start with the
# placeholder, so an unrendered copy never runs with a known key.
#
# Merged over SearXNG's own settings.yml. SEARCH_SOURCES must name exactly the engines kept here
# plus the engine this file adds (wlo) (tests/test_searxng_settings.py).

use_default_settings:
  engines:
    # Engines with an official, free API (ruling D2 a), plus bing and duckduckgo on Jan's choices
    # of 2026-11-19 (rulings D6 and D7; google left out after it blocked the server): they are
    # read by scraping, may block the server's address and then appear in sources_failed. Every
    # other scraping engine stays off.
    keep_only:
      - wikipedia
      - wikibooks
      - wikiversity
      - wikinews
      - mwmbl
      - openalex
      - arxiv
      - crossref
      - bing
      - duckduckgo

general:
  instance_name: text-extraction search

search:
  # The API asks for JSON; html stays for a look at the instance from inside the network.
  formats:
    - html
    - json
  # No autocomplete requests to a scraping backend.
  autocomplete: ""

server:
  secret_key: "ultrasecretkey"
  # Only the API asks (no published port): no bot protection, no public-instance mode, no image
  # proxy.
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  # Cut every engine below the API's SEARCH_TIMEOUT_SECONDS (10): a slow source (crossref waits
  # 30 s by default) is reported as unresponsive instead of failing the whole search.
  max_request_timeout: 8.0

# No Valkey of its own (the limiter is off).
valkey:
  url: false

# Merged by name into SearXNG's engine definitions. Several are disabled by default: each is
# switched on here, so a search that names no engine reaches all of them. wlo is not one of
# SearXNG's engines: it is added here (ruling D6).
engines:
  - name: wikipedia
    disabled: false
    # A list of hits instead of one infobox.
    display_type: ["list"]
  - name: wikibooks
    disabled: false
  - name: wikiversity
    disabled: false
  - name: wikinews
    disabled: false
  - name: mwmbl
    disabled: false
  - name: openalex
    disabled: false
  - name: arxiv
    disabled: false
  - name: crossref
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  # WirLernenOnline: German teaching material from the official, free, public search API of its
  # edu-sharing repository (no key). Each hit links to the material's render page, which the
  # service extracts through the same repository's REST API (package 22).
  - name: wlo
    engine: json_engine
    shortcut: wlo
    categories: [general]
    disabled: false
    # SearXNG's default is 3 s; the repository's search often takes longer. Below the 8 s cap.
    timeout: 6.0
    method: POST
    headers:
      Accept: application/json
      Content-Type: application/json
    search_url: >-
      https://redaktion.openeduhub.net/edu-sharing/rest/search/v1/queries/-home-/mds_oeh/ngsearch?contentType=FILES&maxItems=10&skipCount={pageno}&propertyFilter=cclom:title&propertyFilter=cclom:general_description
    # json_engine puts the query into the body as it is: a double quote or a backslash in it makes
    # the body invalid, and WLO then appears in sources_failed.
    request_body: '{{"criteria": [{{"property": "ngsearchword", "values": ["{query}"]}}]}}'
    paging: true
    page_size: 10
    first_page_num: 0
    results_query: nodes
    url_query: ref/id
    url_prefix: https://redaktion.openeduhub.net/edu-sharing/components/render/
    title_query: properties/cclom:title/0
    content_query: properties/cclom:general_description/0
    about:
      website: https://wirlernenonline.de/
      official_api_documentation: https://redaktion.openeduhub.net/edu-sharing/swagger/
      use_official_api: true
      require_api_key: false
      results: JSON
