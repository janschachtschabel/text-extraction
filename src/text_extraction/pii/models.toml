# The spaCy models of the NLP worker, as `text-extraction-nlp-worker --download-models` puts them
# under PII_MODELS_PATH (ruling N14). Each entry is a model wheel (a zip) from the
# explosion/spacy-models GitHub releases: `url`, `size` and `sha256` describe the wheel, which
# must match exactly, otherwise nothing is put in place. `unpack` is the member prefix under
# which the model lives in the wheel; those members are extracted into `path` (one directory per
# model, named like the model) and the wheel is discarded. Only the two models of PII_MODEL_SIZE
# (`lg` or `md`: `de_core_news_<size>` and `en_core_web_<size>`) are downloaded; a change to
# another model's entry makes no run download again. Sizes and SHA-256 values were measured on
# 2026-10-28 (docs/superpowers/plans/2026-10-26-package-7-calibration.md). All four are version
# 3.8.0, for spaCy >=3.8.0,<3.9.0 (their meta.json), licence MIT. The licences and the data the
# models were trained on are in NOTICE.

