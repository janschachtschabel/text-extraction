# Tesseract's `tsv` output config (Apache-2.0): with TESSDATA_PREFIX (or --tessdata-dir) on the
# volume, Tesseract reads its configs from tessdata/configs, and Docling asks for `tsv` output.
# tesseract-ocr/tessconfigs at commit 3decf1c (2019-10-23), the submodule tessdata_best e12c65a
# names (tessdata_best's `configs` is a link into it).
[[files]]
