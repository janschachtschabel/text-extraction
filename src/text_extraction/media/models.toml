# The Whisper models of the ASR worker, as `text-extraction-asr-worker --download-models` puts them
# under ASR_MODELS_PATH (ruling M13). Each file is fetched from its `url`, which names a fixed
# commit, and must have exactly `size` bytes and this SHA-256; otherwise nothing is put in place.
# Only the files of the configured ASR_MODEL (the first path segment, one of ASR_MODEL's values)
# are downloaded; a change to that model's entries makes the next run download it again. The files
# are faster-whisper 1.2.1's (`utils._MODELS`, its `allow_patterns`); the sizes and SHA-256 values
# were checked against the Hub's LFS hashes (docs/superpowers/plans/2026-10-25-package-6-spike.md).
# The licences are in NOTICE.

