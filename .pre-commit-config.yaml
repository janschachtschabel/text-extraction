exclude: ^\.claude/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # The vendored htmx and axe-core stay byte for byte as published (tests check their SHA-256).
      - id: end-of-file-fixer
        exclude: ^(src/text_extraction/ui/static/htmx-[0-9.]+\.min\.js|tests/ui/vendor/.*)$
      - id: trailing-whitespace
        exclude: ^(src/text_extraction/ui/static/htmx-[0-9.]+\.min\.js|tests/ui/vendor/.*)$
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^tests/ui/vendor/axe-core-[0-9.]+\.min\.js$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
