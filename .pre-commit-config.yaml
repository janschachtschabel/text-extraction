exclude: ^\.claude/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # The vendored htmx stays byte for byte as published (its SHA-256 is checked in a test).
      - id: end-of-file-fixer
        exclude: ^src/text_extraction/ui/static/htmx-[0-9.]+\.min\.js$
      - id: trailing-whitespace
        exclude: ^src/text_extraction/ui/static/htmx-[0-9.]+\.min\.js$
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
