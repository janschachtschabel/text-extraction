version: 2

# Weekly update PRs for the four kinds of dependencies this repo pins. Minor and patch
# updates arrive as one PR per ecosystem; a major update gets a PR of its own. The 14-day
# cooldown is the repo's 14-day rule (CONTRIBUTING.md): a release gets two weeks before an
# update PR proposes it. Dependabot does not apply the cooldown to security updates.
# A PR is merged after green CI.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    # raised together with the Dockerfile's uv (see #29, #48)
    ignore:
      - dependency-name: "uv-build"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # The Valkey image of the compose files (the Dockerfile entry above does not read compose files;
  # tests/test_compose_files.py keeps docker-compose.yml and docker-compose.build.yml on one tag).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
