name: e2e

# End-to-end batch run (package 3 done-when): 1,000 URLs plus a second client's 20, across two
# worker processes, against a local site farm on loopback addresses. No internet needed. Checks
# that both jobs complete with no failed item and that no host saw more requests at once, or
# closer together, than the outbound limits allow (tests/e2e/run_batch.py).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Valkey 7.2+ for the `#!lua` script flags of the queue scripts; no password needed here.
      valkey:
        image: valkey/valkey:8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads .python-version (3.13) and provisions its own managed Python.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      # Fails the job when a check fails. A fresh service container: the run needs an empty db.
      - name: Run the batch
        env:
          VALKEY_URL: redis://127.0.0.1:6379/0
        run: >-
          uv run python -m tests.e2e.run_batch
          --log-dir e2e-results
          --summary-out e2e-results/summary.md

      - name: Add the summary to the job summary
        if: always()
        run: |
          if [ -f e2e-results/summary.md ]; then
            cat e2e-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # The logs of the API, both workers and the farm, and the farm's record of every request.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: warn
