name: image

# Five images from one Dockerfile, with the same tags:
#   api      ghcr.io/<repo>          default target: API and extract worker, no browser, no Docling,
#                                    no Whisper;
#   browser  ghcr.io/<repo>-browser  target `browser`: the browser worker;
#   docling  ghcr.io/<repo>-docling  target `docling`: the Docling worker (no models inside);
#   asr      ghcr.io/<repo>-asr      target `asr`: the ASR worker (PyAV on an LGPL FFmpeg, no models,
#                                    no ffmpeg program);
#   nlp      ghcr.io/<repo>-nlp      target `nlp`: the NLP worker (Presidio and spaCy, no models).
# Each image is built and checked first; pull requests stop there and push nothing.
# Pushes to main publish `latest` (staging) and `sha-<short>`.
# Tags vX.Y.Z publish `X.Y.Z` and `X.Y` (production uses SemVer tags only).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    name: image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # The Docling image (torch) takes longest.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: api
            target: runtime
            suffix: ""
          - variant: browser
            target: browser
            suffix: "-browser"
          - variant: docling
            target: docling
            suffix: "-docling"
          - variant: asr
            target: asr
            suffix: "-asr"
          - variant: nlp
            target: nlp
            suffix: "-nlp"
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
      CHECK_TAG: text-extraction-${{ matrix.variant }}:check
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` only comes from main; SemVer tags never move it.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/setup-buildx-action@v4

      # Build into the local Docker daemon for the checks below.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ env.CHECK_TAG }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The API image must not hold a browser: no Playwright or Patchright package, no Chromium,
      # no Chrome.
      - name: API image has no browser
        if: matrix.variant == 'api'
        run: |
          docker run --rm "$CHECK_TAG" python -c '
          import importlib.util, sys
          found = [name for name in ("playwright", "patchright") if importlib.util.find_spec(name)]
          sys.exit(f"browser packages in the API image: {found}" if found else 0)
          '
          docker run --rm "$CHECK_TAG" sh -c '
          for path in /opt/ms-playwright /opt/google /usr/bin/google-chrome /usr/bin/chromium; do
            if [ -e "$path" ]; then echo "browser in the API image: $path" >&2; exit 1; fi
          done
          '

      # The API image must not hold Docling, torch or Tesseract (they belong to the Docling image).
      - name: API image has no docling or torch
        if: matrix.variant == 'api'
        run: |
          docker run --rm "$CHECK_TAG" python -c '
          import importlib.util, sys
          names = ("docling", "docling_core", "docling_ibm_models", "torch", "torchvision")
          found = [name for name in names if importlib.util.find_spec(name)]
          sys.exit(f"Docling packages in the API image: {found}" if found else 0)
          '
          docker run --rm "$CHECK_TAG" sh -c '
          if command -v tesseract; then echo "tesseract in the API image" >&2; exit 1; fi
          '

      # The API image must not hold the transcription stack (it belongs to the ASR image): no
      # faster-whisper, CTranslate2, PyAV or Deno, and no ffmpeg program.
      - name: API image has no faster_whisper, ctranslate2, av, deno
        if: matrix.variant == 'api'
        run: |
          docker run --rm "$CHECK_TAG" python -c '
          import importlib.util, sys
          names = ("faster_whisper", "ctranslate2", "av", "deno")
          found = [name for name in names if importlib.util.find_spec(name)]
          sys.exit(f"ASR packages in the API image: {found}" if found else 0)
          '
          docker run --rm "$CHECK_TAG" sh -c '
          for tool in ffmpeg deno; do
            if command -v "$tool"; then echo "$tool in the API image" >&2; exit 1; fi
          done
          '

      # The API image must not hold the PII stack (it belongs to the NLP image): no Presidio, spaCy
      # or thinc, so no model could be loaded in it either.
      - name: API image has no presidio_analyzer, spacy, thinc
        if: matrix.variant == 'api'
        run: |
          docker run --rm "$CHECK_TAG" python -c '
          import importlib.util, sys
          names = ("presidio_analyzer", "spacy", "thinc")
          found = [name for name in names if importlib.util.find_spec(name)]
          sys.exit(f"PII packages in the API image: {found}" if found else 0)
          '

      # Every image runs tini as PID 1 and as the non-root user 10001.
      - name: Image runs tini as a non-root user
        run: |
          test "$(docker image inspect -f '{{json .Config.Entrypoint}}' "$CHECK_TAG")" = '["/usr/bin/tini","--"]'
          test "$(docker image inspect -f '{{.Config.User}}' "$CHECK_TAG")" = 10001
          docker run --rm "$CHECK_TAG" sh -c 'test "$(id -u)" = 10001 && /usr/bin/tini --version'

      # Both drivers start in the image, as the pods run it: non-root, read-only root filesystem,
      # /tmp as the only writable place, Xvfb for headful Chrome. --check needs no Valkey.
      - name: Browser image starts its browsers
        if: matrix.variant == 'browser'
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=1g --shm-size 1g \
            --security-opt no-new-privileges:true \
            -e AUTH_MODE=none -e BROWSER_ENABLED=true -e BROWSER_UNBLOCK_ENABLED=true \
            "$CHECK_TAG" text-extraction-browser-worker --check

      # Chrome's .deb leaves no apt source or key behind, and the installer's curl is gone.
      - name: Browser image has no extra apt source
        if: matrix.variant == 'browser'
        run: |
          docker run --rm "$CHECK_TAG" sh -c '
          if ls /etc/apt/sources.list.d/ /etc/apt/trusted.gpg.d/ 2>/dev/null | grep -i google; then
            echo "Google apt source or key in the browser image" >&2; exit 1
          fi
          if command -v curl; then echo "curl in the browser image" >&2; exit 1; fi
          test -x /opt/google/chrome/chrome
          '

      # No models in the image: /models is an empty mount point.
      - name: Docling image holds no models
        if: matrix.variant == 'docling'
        run: |
          docker run --rm "$CHECK_TAG" sh -c '
          test -d /models && test -z "$(ls -A /models)" && command -v tesseract
          '

      # The models of the manifest, cached by its hash (as in the CI job `documents`). On a miss
      # the image itself downloads them, as the Helm init container does (writable mount).
      - name: Docling models cache
        if: matrix.variant == 'docling'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/docling-models
          key: docling-models-${{ hashFiles('src/text_extraction/documents/models.toml') }}
      - name: Docling image downloads the models
        if: matrix.variant == 'docling'
        run: |
          mkdir -p "$RUNNER_TEMP/docling-models"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/docling-models"
          docker run --rm --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/docling-models:/models" -e AUTH_MODE=none \
            "$CHECK_TAG" text-extraction-docling-worker --download-models
          # The cache step saves the directory after the job as the runner user.
          sudo chmod -R a+rX "$RUNNER_TEMP/docling-models"

      # The worker converts its built-in scan with the models mounted read-only, as the pods run
      # it: non-root, read-only root filesystem, /tmp as the only writable place. No Valkey needed.
      - name: Docling image reads its built-in scan
        if: matrix.variant == 'docling'
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=1g --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/docling-models:/models:ro" -e AUTH_MODE=none -e DOCLING_ENABLED=true \
            "$CHECK_TAG" text-extraction-docling-worker --check

      # No models and no FFmpeg programs in the ASR image: /models and /scratch are empty mount
      # points, FFmpeg is there as LGPL shared libraries only, and Deno (the binary of the `deno`
      # package that yt-dlp is given by path) runs.
      - name: ASR image holds no models and no ffmpeg program
        if: matrix.variant == 'asr'
        run: |
          docker run --rm "$CHECK_TAG" sh -c '
          test -d /models && test -z "$(ls -A /models)"
          test -d /scratch && test -z "$(ls -A /scratch)"
          for tool in ffmpeg ffprobe ffplay rtmpdump; do
            if command -v "$tool"; then echo "$tool in the ASR image" >&2; exit 1; fi
          done
          test ! -e /opt/ffmpeg/bin
          test -f /opt/ffmpeg/LICENSE.txt
          '
          docker run --rm --read-only --tmpfs /tmp "$CHECK_TAG" python -c '
          import subprocess, deno
          subprocess.run([deno.find_deno_bin(), "--version"], check=True)
          '

      # The self-check of the external backend needs no model and sends nothing: FFmpeg's licence
      # (LGPL, no GPL or non-free library or codec), no ffmpeg or rtmpdump on PATH, and the built-in
      # clip decoded and encoded as Ogg Opus (libopus). As the pods run it: non-root, read-only root
      # filesystem, /tmp as the only writable place. No Valkey needed.
      - name: ASR image passes its self-check (licence, PATH, Opus)
        if: matrix.variant == 'asr'
        run: |
          docker run --rm --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -e AUTH_MODE=none -e ASR_BACKEND=openai -e ASR_EXTERNAL_BASE_URL=https://asr.invalid/v1 \
            "$CHECK_TAG" text-extraction-asr-worker --check

      # The model `small` (fast; the default large-v3-turbo is exercised weekly by the CI job
      # `media`), cached by the manifest's hash as in that job. On a miss the image itself
      # downloads it, as the Helm init container does (writable mount).
      - name: ASR model cache
        if: matrix.variant == 'asr'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/asr-models
          key: asr-models-small-image-${{ hashFiles('src/text_extraction/media/models.toml') }}
      - name: ASR image downloads the model
        if: matrix.variant == 'asr'
        run: |
          mkdir -p "$RUNNER_TEMP/asr-models"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/asr-models"
          docker run --rm --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/asr-models:/models" -e AUTH_MODE=none -e ASR_MODEL=small \
            "$CHECK_TAG" text-extraction-asr-worker --download-models
          # The cache step saves the directory after the job as the runner user.
          sudo chmod -R a+rX "$RUNNER_TEMP/asr-models"

      # The local backend's self-check: the same licence and PATH checks, then the built-in clip
      # transcribed with the model mounted read-only, as the pods run it.
      - name: ASR image transcribes its built-in clip
        if: matrix.variant == 'asr'
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=1g --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/asr-models:/models:ro" -e AUTH_MODE=none -e ASR_MODEL=small \
            "$CHECK_TAG" text-extraction-asr-worker --check

      # No models in the NLP image: /models is an empty mount point.
      - name: NLP image holds no models
        if: matrix.variant == 'nlp'
        run: |
          docker run --rm "$CHECK_TAG" sh -c '
          test -d /models && test -z "$(ls -A /models)"
          '

      # The models `md` (the weekly CI job `nlp` also runs `lg`), cached by the manifest's hash as
      # in that job. On a miss the image itself downloads them, as the Helm init container does
      # (writable mount).
      - name: NLP models cache
        if: matrix.variant == 'nlp'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nlp-models
          key: nlp-models-md-image-${{ hashFiles('src/text_extraction/pii/models.toml') }}
      - name: NLP image downloads the models
        if: matrix.variant == 'nlp'
        run: |
          mkdir -p "$RUNNER_TEMP/nlp-models"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/nlp-models"
          docker run --rm --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/nlp-models:/models" -e AUTH_MODE=none -e PII_MODEL_SIZE=md \
            "$CHECK_TAG" text-extraction-nlp-worker --download-models
          # The cache step saves the directory after the job as the runner user.
          sudo chmod -R a+rX "$RUNNER_TEMP/nlp-models"

      # The worker's self-check: both models loaded from the volume mounted read-only, a person
      # and an e-mail address found in a German and an English sentence, as the pods run it:
      # non-root, read-only root filesystem, /tmp as the only writable place. No Valkey needed.
      - name: NLP image passes its self-check
        if: matrix.variant == 'nlp'
        run: |
          docker run --rm --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/nlp-models:/models:ro" -e AUTH_MODE=none -e PII_MODEL_SIZE=md \
            "$CHECK_TAG" text-extraction-nlp-worker --check

      - name: Image size
        run: |
          size="$(docker image inspect -f '{{.Size}}' "$CHECK_TAG")"
          echo "${{ matrix.variant }} image: $((size / 1000000)) MB"
          echo "${{ matrix.variant }} image: $((size / 1000000)) MB" >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build from the cache, now with the release tags and pushed.
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
