name: live

# Live regression: runs the service against real URLs (needs the internet) and checks the
# share of URLs that yield usable text. Not part of ci.yml: it is slow and depends on third-party
# sites. Start it by hand, label a pull request `live`, or wait for the weekly run.
#
# The browser worker runs next to the API with browser mode on and unblock mode off: the gate
# measures standard behaviour, which is what a partner gets without the admin exception.
on:
  workflow_dispatch:
    inputs:
      url_set:
        description: URL list in tests/live/urls
        type: choice
        options: [smoke, wlo_50, wlo_200, wlo_4000]
        default: wlo_200
      mode:
        description: >-
          Mode of the run on url_set (the gate always runs in auto). The full regression on
          wlo_4000 is three runs: auto, fast and browser
        type: choice
        options: [auto, fast, browser]
        default: auto
      min_ok_rate:
        description: Fail below this ok rate, in percent (applies in auto mode only)
        type: string
        default: "80"
      service_ref:
        description: >-
          Measure the service of this branch, tag or full commit SHA (empty: this commit), with
          this run's harness and URL lists
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC

permissions:
  contents: read

# A new run for the same ref cancels the one in progress. Adding any other label than `live`
# gets a group of its own, so it neither cancels a live run nor runs itself (see `if` below), and
# so does a manual run of another service_ref: both halves of an A/B comparison run side by side.
# A manual run on wlo_4000 and a manual run in fast or browser mode get groups of their own too,
# so the weekly run or a wlo_200 dispatch never cancels an hours-long full regression and one
# mode's run never cancels another's by accident. That is no invitation to run the modes of the
# full regression in parallel: each is its own service with its own outbound limits, so start the
# next one only when the previous one finished (tests/live/README.md).
concurrency:
  group: >-
    live-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'live'
    && format('-other-label-{0}', github.run_id) || '' }}${{ inputs.service_ref
    && format('-service-{0}', inputs.service_ref) || '' }}${{ inputs.url_set == 'wlo_4000'
    && '-set-wlo_4000' || '' }}${{ inputs.mode && inputs.mode != 'auto'
    && format('-mode-{0}', inputs.mode) || '' }}
  cancel-in-progress: true

jobs:
  live:
    # Pull requests run only while they carry the `live` label, and adding another label does
    # not start a run.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'live')
          && (github.event.action != 'labeled' || github.event.label.name == 'live'))
    runs-on: ubuntu-latest
    # Five runs: the gate, the smoke report, wlo_200 forced through the browser, the media set
    # and the site structure crawl (at most 20 minutes). The full regression on wlo_4000 is one
    # run of 4,000 URLs and nothing else (the report-only steps are skipped), so it gets 330
    # minutes, below the 360 that GitHub allows a job.
    timeout-minutes: ${{ inputs.url_set == 'wlo_4000' && 330 || 110 }}
    env:
      # The gate: wlo_200 in auto mode at the 80 % browser baseline (measured on 4,000 URLs,
      # 2026-09-28). Only a manual run can pick others; the smoke set is never a gate.
      URL_SET: ${{ inputs.url_set || 'wlo_200' }}
      MIN_OK_RATE: ${{ inputs.min_ok_rate || '80' }}
      # Pull requests and the weekly run always use auto. A manual run can pick fast or browser
      # to compare with the 2026-09-28 baselines (fast 68 %, browser 80 % on 4,000 URLs).
      MODE: ${{ inputs.mode || 'auto' }}
    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # An A/B comparison: the service (src, pyproject.toml, uv.lock) of another commit, measured
      # with this harness and these URL lists, so a change of the ok rate can be told from a
      # change of the sites. Compare the "URLs not ok" tables of both runs.
      - name: Take the service from ${{ inputs.service_ref }}
        if: inputs.service_ref != ''
        env:
          SERVICE_REF: ${{ inputs.service_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$SERVICE_REF"
          rm -rf src
          git checkout FETCH_HEAD -- src pyproject.toml uv.lock
          git log -1 --format='service under test: %H %s' FETCH_HEAD

      # uv reads .python-version (3.13) and provisions its own managed Python.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The browser worker runs from the source checkout, so the browser extra is installed.
      - run: uv sync --locked --extra browser

      # The standard browser of the worker: Playwright's headless Chromium. Unblock mode (Chrome
      # and Xvfb) is off here, so nothing more is installed.
      - run: uv run playwright install --with-deps --only-shell chromium

      # Browser mode is on for the API and the worker; unblock mode stays off. The browser worker
      # serves /ready on its own internal port, since the API holds 9090.
      - name: Start the service and the browser worker
        env:
          AUTH_MODE: none
          RATE_LIMIT_ENABLED: "false"
          VALKEY_URL: redis://127.0.0.1:6379/0
          BROWSER_ENABLED: "true"
          BROWSER_UNBLOCK_ENABLED: "false"
          # One browser worker with 4 pages at once serves every escalation of the run: a sync
          # request waits up to 30 s for a free page, so a burst of escalations is measured as
          # the product's answer, not as a browser_unavailable of the test rig.
          BROWSER_CONCURRENCY: "4"
          BROWSER_QUEUE_WAIT_SECONDS: "30"
        run: |
          mkdir -p results
          nohup uv run text-extraction > results/server.log 2>&1 &
          INTERNAL_PORT=9091 nohup uv run text-extraction-browser-worker \
            > results/browser-worker.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/ready > /dev/null 2>&1 \
              && curl -sS -o /dev/null http://127.0.0.1:8080/ 2>/dev/null \
              && curl -fsS http://127.0.0.1:9091/ready > /dev/null 2>&1; then
              echo "service and browser worker are ready"
              exit 0
            fi
            sleep 2
          done
          echo "service and browser worker did not become ready within 120 s" >&2
          tail -n 50 results/server.log >&2
          tail -n 50 results/browser-worker.log >&2
          exit 1

      # The gate: fails the job when the ok rate is below MIN_OK_RATE (not for smoke, and not in
      # fast or browser mode: those runs compare with the baselines and are reported, never
      # gated). Pull requests and the weekly run are always in auto mode, the mode of
      # production. The client waits 120 s: an escalating request can take the fast phase (25 s),
      # the queue wait (30 s) and the render (30 s + 5 s). A browser run sends as many requests
      # at once as the worker renders pages (BROWSER_CONCURRENCY), as the report-only browser
      # step does, so the queue wait does not depress the rate it is compared on.
      - name: Run ${{ env.URL_SET }} in ${{ env.MODE }} mode
        run: |
          gate=(--min-ok-rate "$MIN_OK_RATE")
          if [ "$URL_SET" = smoke ] || [ "$MODE" != auto ]; then
            gate=()
          fi
          concurrency=()
          if [ "$MODE" = browser ]; then
            concurrency=(--concurrency 4)
          fi
          uv run python -m tests.live.run_live \
            --urls "tests/live/urls/${URL_SET}.csv" \
            --mode "$MODE" \
            "${concurrency[@]}" \
            --timeout 120 \
            --out "results/live_${URL_SET}_${MODE}.jsonl" \
            --summary-out "results/summary_${URL_SET}_${MODE}.md" \
            "${gate[@]}"

      # Reports only, no gate: the smoke set is a watchlist of hard pages, and wlo_200 with every
      # URL forced through the browser shows what the fast path leaves out (per domain, fast
      # against browser). The smoke report is skipped when the run above was the smoke set. The
      # browser run sends as many requests at once as the worker renders pages. The report-only
      # steps are skipped on wlo_4000: the full regression measures one mode per run.
      - name: Run smoke in auto mode (report only)
        if: always() && env.URL_SET != 'smoke' && env.URL_SET != 'wlo_4000'
        run: |
          uv run python -m tests.live.run_live \
            --urls tests/live/urls/smoke.csv \
            --mode auto \
            --timeout 120 \
            --out results/live_smoke_auto.jsonl \
            --summary-out results/summary_smoke_auto.md

      - name: Run wlo_200 in browser mode (report only)
        if: always() && env.URL_SET != 'wlo_4000'
        run: |
          uv run python -m tests.live.run_live \
            --urls tests/live/urls/wlo_200.csv \
            --mode browser \
            --concurrency 4 \
            --timeout 120 \
            --out results/live_wlo_200_browser.jsonl \
            --summary-out results/summary_wlo_200_browser.md

      # Report only, no gate: the media set (YouTube, Vimeo, the Mediatheken, media files, HTML5
      # tracks). This rig runs no ASR worker, so the rows' `transcribe` is not sent and the media
      # files answer without a transcript. From the runners' data-centre IPs YouTube may refuse
      # the subtitles (decision D1: metadata_only with subtitles_blocked). The summary's media
      # table counts the transcript sources per platform against each row's expected source.
      - name: Run media in auto mode (report only)
        if: always() && env.URL_SET != 'wlo_4000'
        run: |
          uv run python -m tests.live.run_live \
            --urls tests/live/urls/media.csv \
            --mode auto \
            --no-transcribe \
            --timeout 120 \
            --out results/live_media_auto.jsonl \
            --summary-out results/summary_media_auto.md

      # Report only, never fails the job (package 9): the site structure crawl of five WLO-type
      # sites, one click deep, at most 25 pages each, under `compliance: enforce` (a crawler
      # follows links, so robots.txt and TDM opt-outs bind it: CLAUDE.md rule 6, decision D4;
      # the summary counts the links that say `blocked`). A crawl is a `site` job, so an extract
      # worker starts here, after the runs above (they measure the rig without one), with its
      # internal port on 9092. The summary goes to the job log and, with the others, to the job
      # summary. Not after a cancel: no crawl of real sites once someone stopped the run.
      - name: Run the site structure crawl (report only)
        if: ${{ !cancelled() && env.URL_SET != 'wlo_4000' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          AUTH_MODE: none
          VALKEY_URL: redis://127.0.0.1:6379/0
          BROWSER_ENABLED: "true" # as on the API and the browser worker; crawls stay in fast mode
          INTERNAL_PORT: "9092"
        run: |
          mkdir -p results
          nohup uv run text-extraction-worker > results/extract-worker.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9092/ready > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9092/ready > /dev/null 2>&1 \
            || { echo "the extract worker is not ready" >&2; tail -n 50 results/extract-worker.log >&2; }
          uv run python -m tests.live.run_site \
            --urls tests/live/urls/sites.csv \
            --depth 1 \
            --max-pages 25 \
            --compliance enforce \
            --job-timeout 900 \
            --out results/site_structure.jsonl \
            --summary-out results/summary_site_structure.md || true

      - name: Add the summaries to the job summary
        if: always()
        run: |
          for file in results/summary_*.md; do
            [ -f "$file" ] && { echo "### $(basename "$file" .md)"; cat "$file"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-results
          path: |
            results/*.jsonl
            results/server.log
            results/browser-worker.log
            results/extract-worker.log
          if-no-files-found: warn
