name: load

# Load test (package 11): the compose stack with every profile, plus a local site farm and a fake
# LLM (deploy/load/compose.load.yml), under the load profile of tests/load/scenarios.py. docker
# stats is sampled every 2 s; the report gives CPU and memory per scenario and service and the
# Helm sizing they lead to. No load goes to a third-party site: every target is the farm container,
# and the LLM is the fake. Only the image builds and the model downloads use the internet.
#
# A dispatch works only once this file is on the default branch, so a pull request that carries
# the label `load` runs it too, with the dispatch defaults (ruling R-P11-5).
#
# The full profile runs once, at the production default of one selector process, into
# load-results/. Then the selector sweep: each value of selector_processes, the first included,
# restarts the stack with STRUCTURED_SELECTOR_PROCESSES set and runs only the selector scenario on
# the fresh containers, into load-results/selector-processes-<n>/. The full run's selector
# scenario is not part of the sweep: its containers have served every other scenario first.
on:
  workflow_dispatch:
    inputs:
      selector_processes:
        description: >-
          STRUCTURED_SELECTOR_PROCESSES values of the selector sweep, comma-separated, each once;
          each runs the selector scenario alone on a fresh stack
        type: string
        default: "1,2,4"
      asr_model:
        description: Whisper model of the ASR worker (ASR_MODEL)
        type: choice
        options: [small, large-v3-turbo]
        default: large-v3-turbo
      pii_model_size:
        description: spaCy model size of the NLP worker (PII_MODEL_SIZE)
        type: choice
        options: [md, lg]
        default: lg
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read

# A new run for the same ref cancels the one in progress. Adding any other label than `load` gets
# a group of its own, so it neither cancels a load run nor runs itself (see `if` below).
concurrency:
  group: >-
    load-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'load'
    && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  load:
    # Pull requests run only while they carry the `load` label, and adding another label does
    # not start a run.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'load')
          && (github.event.action != 'labeled' || github.event.label.name == 'load'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The sizing report strips this prefix from the container names.
      COMPOSE_PROJECT_NAME: text-extraction
      # Every compose call: the base file, the load override and every profile.
      COMPOSE: >-
        docker compose -f docker-compose.yml -f deploy/load/compose.load.yml
        --profile docling --profile asr --profile nlp --profile llm
      # A pull request has no inputs: the dispatch defaults apply, which are the production
      # defaults (ruling R-P11-6). The override reads the models.
      SELECTOR_PROCESSES: ${{ inputs.selector_processes || '1,2,4' }}
      ASR_MODEL: ${{ inputs.asr_model || 'large-v3-turbo' }}
      PII_MODEL_SIZE: ${{ inputs.pii_model_size || 'lg' }}
      # The internal ports the override publishes on 127.0.0.1: api, worker, browser, docling,
      # asr, nlp and llm worker.
      INTERNAL_URLS: >-
        http://127.0.0.1:9090,http://127.0.0.1:9091,http://127.0.0.1:9092,http://127.0.0.1:9093,http://127.0.0.1:9094,http://127.0.0.1:9095,http://127.0.0.1:9096
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The five images and the models (about 2.5 GB with large-v3-turbo) need more room than the
      # runner leaves free; these toolchains are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # uv reads .python-version (3.13) and provisions its own managed Python. The generator runs
      # on the runner; the dev group holds python-docx for the generated upload.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      # Both values are masked before anything else uses them. The service gets only the key's
      # SHA-256; the generator reads the key from API_KEY and sends it only as a header.
      - name: Create .env with a fresh Valkey password and API key
        run: |
          valkey_password="$(openssl rand -hex 24)"
          api_key="$(openssl rand -hex 32)"
          echo "::add-mask::$valkey_password"
          echo "::add-mask::$api_key"
          sha="$(printf %s "$api_key" | sha256sum | cut -d' ' -f1)"
          umask 077
          {
            echo "VALKEY_PASSWORD=$valkey_password"
            echo "AUTH_MODE=api_key"
            echo "API_KEYS='[{\"name\":\"load\",\"role\":\"user\",\"sha256\":\"$sha\"}]'"
          } > .env
          echo "API_KEY=$api_key" >> "$GITHUB_ENV"

      - name: Build the images
        run: $COMPOSE build

      # Every run starts from fresh containers (--force-recreate; the model volumes stay). Before
      # the next run replaces them, the farm is stopped, which writes its record of every request
      # it saw, and the record and the service logs are saved under the run's name. A failed or
      # unexpected request fails the step after the last run; a stack that does not come up
      # fails it at once.
      - name: Run the load test
        run: |
          IFS=, read -ra values <<< "$SELECTOR_PROCESSES"
          if [ "${#values[@]}" -eq 0 ]; then
            echo "selector_processes is empty" >&2
            exit 2
          fi
          seen=","
          for i in "${!values[@]}"; do
            values[i]="${values[i]//[[:space:]]/}"
            if ! [[ "${values[i]}" =~ ^[1-9][0-9]*$ ]]; then
              echo "selector_processes: '${values[i]}' is not a whole number of at least 1" >&2
              exit 2
            fi
            if [[ "$seen" == *",${values[i]},"* ]]; then
              echo "selector_processes: '${values[i]}' is given more than once" >&2
              exit 2
            fi
            seen+="${values[i]},"
          done

          # The farm (uid 10001) writes its record into this directory.
          mkdir -p load-results/farm
          chmod 0777 load-results/farm

          # The artifact is not masked like the job log: no file under load-results/ may hold
          # the API key or the Valkey password (both hex, so they are safe in a sed pattern).
          redact() {
            local secret file
            for secret in "${API_KEY:-}" "$(sed -n 's/^VALKEY_PASSWORD=//p' .env 2>/dev/null)"; do
              [[ "$secret" =~ ^[0-9a-f]+$ ]] || continue
              # grep finds nothing in the usual case: not an error.
              { grep -rlF -- "$secret" load-results || true; } | while read -r file; do
                sed -i "s/$secret/***/g" "$file"
                echo "::warning::removed a secret from $file"
              done
            done
          }

          finish_run() {
            $COMPOSE stop farm || true
            if [ -f load-results/farm/farm-record.json ]; then
              mv load-results/farm/farm-record.json "load-results/farm/$1.json"
            else
              echo "::warning::the farm wrote no record for the run $1"
            fi
            mkdir -p "load-results/logs/$1"
            for service in $($COMPOSE ps --all --services); do
              $COMPOSE logs --no-color --timestamps "$service" \
                > "load-results/logs/$1/$service.log" 2>&1 || true
            done
            redact
          }

          # Into the job log, after a stack that did not become ready: the state of every
          # container, then the last 80 lines of each one that is unhealthy, still starting or
          # exited with an error, from the saved and redacted logs.
          show_failed() {
            local service
            # No command column: Valkey's holds its password.
            $COMPOSE ps -a --format 'table {{.Service}}\t{{.State}}\t{{.Status}}' || true
            for service in $($COMPOSE ps -a --format json | jq -r '(if type == "array" then .[] else . end)
                | select(.Health == "unhealthy" or .Health == "starting"
                    or (.State == "exited" and .ExitCode != 0)) | .Service'); do
              echo "::group::the last 80 lines of $service"
              tail -n 80 "load-results/logs/$1/$service.log" || true
              echo "::endgroup::"
            done
          }

          # name, STRUCTURED_SELECTOR_PROCESSES, then the generator's own arguments
          load_run() {
            local name="$1" processes="$2"
            shift 2
            export STRUCTURED_SELECTOR_PROCESSES="$processes"
            if ! $COMPOSE up -d --wait --wait-timeout 1800 --force-recreate; then
              echo "the stack did not become ready for the run $name" >&2
              finish_run "$name"
              show_failed "$name"
              exit 1
            fi
            uv run python -m tests.load.run_load \
              --base-url http://127.0.0.1:8080 \
              --internal-urls "$INTERNAL_URLS" \
              --farm-url http://farm:8000 \
              --fake-llm-url http://127.0.0.1:8000 \
              --selector-processes "$processes" \
              "$@" || status=1
            finish_run "$name"
          }

          status=0
          load_run full 1 --out-dir load-results
          for value in "${values[@]}"; do
            load_run "selector-processes-$value" "$value" \
              --out-dir "load-results/selector-processes-$value" --only structured-selectors-200
          done
          exit "$status"

      - name: Add the summaries to the job summary
        if: always()
        run: |
          if [ -f load-results/summary.md ]; then
            cat load-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          for file in load-results/selector-processes-*/summary.md; do
            [ -f "$file" ] || continue
            { echo; echo "## $(basename "$(dirname "$file")")"; echo; cat "$file"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      # Only what the generator wrote (summary.md, sizing.json, stats.jsonl, results.jsonl,
      # metrics/), the farm's records (farm/) and the service logs; never .env or any inspect
      # output.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-results
          path: load-results/**
          if-no-files-found: warn

      - name: Remove the stack and its volumes
        if: always()
        run: $COMPOSE down -v --remove-orphans
