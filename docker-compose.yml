# Reference setup for local runs. Production uses the Helm chart, not this file.
# Start: cp .env.example .env, set API_KEYS and VALKEY_PASSWORD, then `docker compose up -d --wait`.
# VALKEY_PASSWORD has no default: compose stops with an error while it is empty or missing.
# The browser worker image (target `browser`) holds Chromium and Google Chrome (linux/amd64 only).
# OCR (the Docling worker, image target `docling`, about 2 GB) is off by default: set
# DOCLING_ENABLED=true in .env and start with `docker compose --profile docling up -d --wait`.
# The one-shot service `docling-models` first downloads the models into the volume `docling-models`
# (9 files, about 335 MiB, once), then `docling-worker` reads them read-only.
# Transcription (the ASR worker, image target `asr`) is off by default too: set ASR_ENABLED=true in
# .env and start with `docker compose --profile asr up -d --wait`. The one-shot service
# `asr-models` first downloads the Whisper model ASR_MODEL (default large-v3-turbo, about 1.6 GB;
# `small` about 0.5 GB) into the volume `asr-models`, then `asr-worker` reads it read-only. With
# ASR_BACKEND=openai (and ASR_EXTERNAL_BASE_URL, optionally ASR_EXTERNAL_API_KEY, in .env) no model
# is downloaded. Both profiles can run together: --profile docling --profile asr.
# PII handling (the NLP worker, image target `nlp`) is off by default too: set PII_ENABLED=true in
# .env and start with `docker compose --profile nlp up -d --wait`. The one-shot service
# `nlp-models` first downloads the German and English spaCy models of PII_MODEL_SIZE (default lg,
# about 1 GB; `md` about 115 MB) into the volume `nlp-models`, then `nlp-worker` reads them
# read-only. A PII_HASH_KEY in .env (at least 32 bytes) makes `mode: hash` consistent across
# results. The LLM (structured output with an LLM, semantic chunking) is off by default too: set
# LLM_ENABLED=true, LLM_BASE_URL, LLM_MODEL and LLM_API_KEY (and LLM_EMBEDDING_MODEL for `semantic`
# chunking) in .env and start with `docker compose --profile llm up -d --wait`. The service
# `llm-worker` runs from the API image (no model, no volume). All four profiles can run together.

# Shared by the API and the workers: same settings, same hardening. The API and the extract worker
# use the default image (no browser); the browser worker builds the target `browser`.
x-app: &app
  build: .
  image: text-extraction:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    # The password sits in a URL and is also the password Valkey checks: use letters and digits
    # only (openssl rand -hex 24). Percent-encoding does not work, see docs/configuration.md.
    VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379/0
    # This file always starts a browser worker, so browser mode is on for every service (an entry
    # in .env does not change it). Unblock mode is read from .env or the shell, default off.
    BROWSER_ENABLED: "true"
    BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-false}
    # OCR: on for every service only with DOCLING_ENABLED=true in .env or the shell, together with
    # the profile `docling` (which starts the Docling worker). Default off.
    DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
    # Transcription: on for every service only with ASR_ENABLED=true in .env or the shell, together
    # with the profile `asr` (which starts the ASR worker). Default off. ASR_BACKEND,
    # ASR_EXTERNAL_API_KEY and the other ASR settings come from .env (env_file) to every service:
    # the API needs the backend and the key too.
    ASR_ENABLED: ${ASR_ENABLED:-false}
    # PII handling: on for every service only with PII_ENABLED=true in .env or the shell, together
    # with the profile `nlp` (which starts the NLP worker). Default off. The other PII settings
    # (PII_MODEL_SIZE, PII_HASH_KEY, ...) come from .env (env_file).
    PII_ENABLED: ${PII_ENABLED:-false}
    # LLM: on for every service only with LLM_ENABLED=true in .env or the shell, together with the
    # profile `llm` (which starts the llm worker). Default off. The other LLM settings
    # (LLM_BASE_URL, LLM_MODEL, LLM_API_KEY, ...) come from .env (env_file): the API needs them too.
    LLM_ENABLED: ${LLM_ENABLED:-false}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  depends_on:
    valkey:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8080:8080" # public API; the internal port 9090 is not published
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # Ready once the document and media children run: up to ~30 s after a rebuild.
      start_period: 60s
    # SIGTERM starts a 5 s drain and a graceful shutdown that covers a sync request waiting for
    # the browser: 75 s, with unblock mode 105 s at the default timeouts. Raise this with
    # SHUTDOWN_DRAIN_SECONDS or the extract and browser timeouts (docs/configuration.md).
    stop_grace_period: 120s

  # Extract worker: runs the items of batches (a slow POST /v1/extract that became a job keeps
  # running in the API container). It serves only the internal port 9090 (not published) and
  # needs the same API_KEYS as the API while AUTH_MODE is api_key.
  worker:
    <<: *app
    command: ["text-extraction-worker"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # SIGTERM stops claiming and gives items in flight up to 30 s; no drain wait.
    stop_grace_period: 45s

  # Browser worker: renders the items of the pool `browser` (mode "browser", screenshots, and
  # "auto" results that need a browser) in Chromium, and in unblock mode in Chrome under Xvfb.
  # Only the internal port 9090, not published. Chrome needs a large /dev/shm and a writable
  # /tmp (HOME points there in the image).
  browser-worker:
    <<: *app
    build:
      context: .
      target: browser
    image: text-extraction-browser:dev
    command: ["text-extraction-browser-worker"]
    tmpfs:
      - /tmp:size=1g
    shm_size: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # The language model, the egress proxy, Xvfb and the browsers start before /ready.
      start_period: 60s
    # SIGTERM stops claiming and gives renders in flight up to 40 s, with unblock mode 70 s, at
    # the default timeouts. Raise this with the browser timeouts (docs/configuration.md).
    stop_grace_period: 90s

  # Downloads the Docling and Tesseract models of the manifest into the volume, checks their
  # SHA-256, then exits; with the files in place it does nothing. Needs the internet on its first
  # run (raw.githubusercontent.com, huggingface.co).
  docling-models:
    <<: *app
    profiles: ["docling"]
    build:
      context: .
      target: docling
    image: text-extraction-docling:dev
    command: ["text-extraction-docling-worker", "--download-models"]
    restart: "no"
    volumes:
      - docling-models:/models

  # Docling worker: converts the items of the pool `docling` (scans, broken text layers, images,
  # OpenDocument files) with Docling and Tesseract. Only the internal port 9090, not published.
  # The models volume is read-only here.
  docling-worker:
    <<: *app
    profiles: ["docling"]
    build:
      context: .
      target: docling
    image: text-extraction-docling:dev
    command: ["text-extraction-docling-worker"]
    volumes:
      - docling-models:/models:ro
    depends_on:
      valkey:
        condition: service_healthy
      docling-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # The children import Docling and torch and convert a built-in scan before /ready.
      start_period: 180s
    # SIGTERM stops claiming and gives conversions in flight 30 s, then kills the children.
    stop_grace_period: 45s

  # Downloads the Whisper model ASR_MODEL (pinned commits, SHA-256 checked) into the volume, then
  # exits; with the files in place, or with ASR_BACKEND=openai, it does nothing. Needs the internet
  # on its first run (huggingface.co).
  asr-models:
    <<: *app
    profiles: ["asr"]
    build:
      context: .
      target: asr
    image: text-extraction-asr:dev
    command: ["text-extraction-asr-worker", "--download-models"]
    restart: "no"
    environment:
      <<: *app-env
      # The image's mount points win over an .env copied from .env.example.
      ASR_MODELS_PATH: /models
    volumes:
      - asr-models:/models

  # ASR worker: transcribes the items of the pool `asr` (transcribe: true without subtitles, audio
  # and video uploads) with faster-whisper on the CPU, or on the external endpoint. Only the
  # internal port 9090, not published. The models volume is read-only here; downloaded media go to
  # the volume `asr-scratch` (deleted after each item, cleaned at start-up), not to the tmpfs /tmp,
  # which is memory.
  asr-worker:
    <<: *app
    profiles: ["asr"]
    build:
      context: .
      target: asr
    image: text-extraction-asr:dev
    command: ["text-extraction-asr-worker"]
    environment:
      <<: *app-env
      # The image's mount points win over an .env copied from .env.example (whose ASR_SCRATCH_PATH,
      # /tmp/asr, would put the media into the tmpfs).
      ASR_MODELS_PATH: /models
      ASR_SCRATCH_PATH: /scratch
    volumes:
      - asr-models:/models:ro
      - asr-scratch:/scratch
    depends_on:
      valkey:
        condition: service_healthy
      asr-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # The child loads the model and transcribes a built-in clip before /ready.
      start_period: 180s
    # SIGTERM stops claiming and gives transcriptions in flight 30 s, then kills the children; their
    # items run again once their lease expires.
    stop_grace_period: 45s

  # Downloads the German and English spaCy models of PII_MODEL_SIZE (explosion/spacy-models
  # releases, SHA-256 checked) into the volume, then exits; with the files in place it does
  # nothing. Needs the internet on its first run (github.com, which redirects to githubusercontent.com).
  nlp-models:
    <<: *app
    profiles: ["nlp"]
    build:
      context: .
      target: nlp
    image: text-extraction-nlp:dev
    command: ["text-extraction-nlp-worker", "--download-models"]
    restart: "no"
    environment:
      <<: *app-env
      # The image's mount point wins over an .env copied from .env.example.
      PII_MODELS_PATH: /models
    volumes:
      - nlp-models:/models

  # NLP worker: analyses the items of the pool `nlp` (results of requests with `pii`) with
  # Presidio and spaCy. Only the internal port 9090, not published. The models volume is
  # read-only here.
  nlp-worker:
    <<: *app
    profiles: ["nlp"]
    build:
      context: .
      target: nlp
    image: text-extraction-nlp:dev
    command: ["text-extraction-nlp-worker"]
    environment:
      <<: *app-env
      PII_MODELS_PATH: /models
    volumes:
      - nlp-models:/models:ro
    depends_on:
      valkey:
        condition: service_healthy
      nlp-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      # The children load both models and analyse a built-in sentence of each before /ready.
      start_period: 120s
    # SIGTERM stops claiming and gives analyses in flight 30 s, then kills the children; their
    # items run again once their lease expires.
    stop_grace_period: 45s

  # LLM worker: runs the last hop of requests with `structured` (strategy llm or auto) or `chunking`
  # (semantic): the items of the pool `llm`, against LLM_BASE_URL. It uses the API image and needs
  # no model or volume. Only the internal port 9090, not published. `docker compose run --rm
  # llm-worker text-extraction-llm-worker --check` sends one tiny extraction to the endpoint.
  llm-worker:
    <<: *app
    profiles: ["llm"]
    command: ["text-extraction-llm-worker"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    # SIGTERM stops claiming and gives items in flight 30 s, then hands the ones still running back
    # to the queue.
    stop_grace_period: 45s

  valkey:
    image: valkey/valkey:8.1-alpine
    # Jobs, the queue and counters are state: refuse writes when full, never evict.
    command:
      - --requirepass
      - ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
    environment:
      # Read by valkey-cli, so the health check authenticates.
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    healthcheck:
      # `valkey-cli ping` exits 0 even when it is refused (NOAUTH, WRONGPASS): compare the answer.
      test: ["CMD-SHELL", 'test "$$(valkey-cli ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - valkey-data:/data

volumes:
  valkey-data:
  docling-models:
  asr-models:
  asr-scratch:
  nlp-models:
