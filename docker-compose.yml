# The ready-to-run stack from the published images (linux/amd64): the file to deploy on a server
# and the one Docker panels such as Hostinger's Docker Manager ("Compose from URL") pick up from
# the repository's main folder. docker-compose.build.yml builds the images from a checkout instead;
# production on Kubernetes uses the Helm chart.
#
# It starts without a single variable. On a server: cp .env.example .env (Hostinger does that
# itself), then `docker compose up -d --wait`. The one-shot service `init` creates the secrets on
# the first start in the volume `secrets` and keeps them afterwards: the Valkey password and an
# admin API key. The key appears once in its log (`docker compose logs init`); later
# `docker compose run --rm -T init text-extraction-init --show-admin-key` prints it. Own keys go
# into API_KEYS in .env as before (merged with the generated one).
#
# The images follow the newest 0.1.x release on their own: the default tag is `0.1`, and
# pull_policy always pulls it on every `docker compose up` (a Docker panel's redeploy included).
# TEXT_EXTRACTION_VERSION in .env or the shell pins another release only when one is wanted, for
# example 0.1.11.
#
# HTTPS: the api service carries Traefik labels (Traefik's Docker provider with
# exposedbydefault=false, as on a Hostinger VPS). Set DOMAIN in .env to the bare host name (no
# https://) whose DNS points at the server; the init service refuses anything else. Until DOMAIN
# is set, Traefik logs a rule error for the empty Host() (harmless). The api service also joins
# the network TRAEFIK_NETWORK (default text-extraction-web, created when missing, shared when it
# exists); Valkey and the workers stay on the project's own network `backend`. Without Traefik the
# labels do nothing. The API is also published on API_PORT
# (default 8080, all interfaces); `127.0.0.1:8080` keeps it to the server itself, so that only
# Traefik's HTTPS reaches it from outside.
#
# Every optional worker is on (OCR, transcription, PII, LLM). FEATURE_ENABLED=false in .env
# (DOCLING_ENABLED, ASR_ENABLED, PII_ENABLED, LLM_ENABLED) switches a feature off for the API; its
# worker still starts. The model services download once into their volumes on the first start
# (Docling about 335 MiB, Whisper large-v3-turbo about 1.6 GB, spaCy lg about 1 GB; the first
# deploy takes accordingly long). With every worker the stack needs about 6 GiB of memory when
# idle: plan a server with 8 GB or more. docs/configuration.md, "Resource baselines", has the
# numbers per service.
#
# Written for web editors on purpose: no YAML anchors or merge keys, no required variables, no
# nested variables, no build, no bind mounts, no external network. The services repeat their
# settings instead; tests/test_compose_files.py keeps them in step with docker-compose.build.yml.

services:
  # Creates the secrets on the first start (Valkey password, admin API key, the files derived from
  # them) and keeps them on every later start; refuses a DOMAIN that is not a bare host name.
  init:
    image: ghcr.io/janschachtschabel/text-extraction:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-init"]
    restart: "no"
    networks:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    networks:
      - backend
    # The password and a ping-only user for the health check come from the generated valkey.conf.
    # Jobs, the queue and counters are state: refuse writes when full, never evict.
    command:
      - valkey-server
      - /secrets/valkey.conf
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      # `valkey-cli ping` exits 0 even when it is refused: compare the answer.
      test: ["CMD-SHELL", 'test "$$(valkey-cli --user healthcheck --pass none --no-auth-warning ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - secrets:/secrets:ro
      - valkey-data:/data
    depends_on:
      init:
        condition: service_completed_successfully

  # The public API, /mcp and the playground /ui on port 8080; the internal port 9090 is not
  # published.
  api:
    image: ghcr.io/janschachtschabel/text-extraction:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    restart: unless-stopped
    networks:
      - default
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # On for the api service unless .env switches them off; under AUTH_MODE=none both are
      # open to anyone who reaches the API.
      MCP_ENABLED: ${MCP_ENABLED:-true}
      UI_ENABLED: ${UI_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-text-extraction-web}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-text-extraction}.rule=Host(`${DOMAIN:-}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-text-extraction}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${TRAEFIK_ROUTER:-text-extraction}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${TRAEFIK_ROUTER:-text-extraction}.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s

  # Extract worker: the items of batches. Only the internal port 9090.
  worker:
    image: ghcr.io/janschachtschabel/text-extraction:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s

  # Browser worker: Chromium, and Chrome under Xvfb in unblock mode. Chrome needs a large /dev/shm
  # and a writable /tmp.
  browser-worker:
    image: ghcr.io/janschachtschabel/text-extraction-browser:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-browser-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    shm_size: 1g
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    stop_grace_period: 90s

  # Downloads the Docling and Tesseract models into the volume once (SHA-256 checked), then exits.
  docling-models:
    image: ghcr.io/janschachtschabel/text-extraction-docling:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-docling-worker", "--download-models"]
    restart: "no"
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - docling-models:/models
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # Docling worker: OCR of scans, images and OpenDocument files. The models volume is read-only.
  docling-worker:
    image: ghcr.io/janschachtschabel/text-extraction-docling:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-docling-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - docling-models:/models:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      docling-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 180s
    stop_grace_period: 45s

  # Downloads the Whisper model ASR_MODEL into the volume once (nothing with ASR_BACKEND=openai).
  asr-models:
    image: ghcr.io/janschachtschabel/text-extraction-asr:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-asr-worker", "--download-models"]
    restart: "no"
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # The image's mount points win over an .env copied from .env.example.
      ASR_MODELS_PATH: /models
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - asr-models:/models
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # ASR worker: transcription with faster-whisper on the CPU (or the external endpoint). Downloaded
  # media go to the volume asr-scratch, not to the tmpfs /tmp, which is memory.
  asr-worker:
    image: ghcr.io/janschachtschabel/text-extraction-asr:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-asr-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      ASR_MODELS_PATH: /models
      ASR_SCRATCH_PATH: /scratch
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - asr-models:/models:ro
      - asr-scratch:/scratch
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      asr-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 180s
    stop_grace_period: 45s

  # Downloads the German and English spaCy models of PII_MODEL_SIZE into the volume once.
  nlp-models:
    image: ghcr.io/janschachtschabel/text-extraction-nlp:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-nlp-worker", "--download-models"]
    restart: "no"
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # The image's mount point wins over an .env copied from .env.example.
      PII_MODELS_PATH: /models
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - nlp-models:/models
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # NLP worker: PII handling with Presidio and spaCy. The models volume is read-only.
  nlp-worker:
    image: ghcr.io/janschachtschabel/text-extraction-nlp:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-nlp-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      PII_MODELS_PATH: /models
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
      - nlp-models:/models:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nlp-models:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    stop_grace_period: 45s

  # LLM worker: structured output with an LLM, semantic chunking and image descriptions against
  # LLM_BASE_URL (LLM_MODEL, and LLM_API_KEY in .env or the caller's X-LLM-Api-Key).
  llm-worker:
    image: ghcr.io/janschachtschabel/text-extraction:${TEXT_EXTRACTION_VERSION:-0.1}
    pull_policy: always
    command: ["text-extraction-llm-worker"]
    restart: unless-stopped
    networks:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      # The secrets the init service created (never variables, see the top of this file).
      VALKEY_URL_FILE: /secrets/valkey-url
      API_KEYS_FILE: /secrets/api-keys.json
      BROWSER_ENABLED: "true"
      BROWSER_UNBLOCK_ENABLED: ${BROWSER_UNBLOCK_ENABLED:-true}
      DOCLING_ENABLED: ${DOCLING_ENABLED:-true}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      PII_ENABLED: ${PII_ENABLED:-true}
      LLM_ENABLED: ${LLM_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s

networks:
  # Shared with Traefik: only the api service joins it.
  default:
    name: ${TRAEFIK_NETWORK:-text-extraction-web}
  # Valkey and the workers: scoped to this project, so a second stack on the same host (whose
  # services carry the same names) never resolves this project's `valkey`.
  backend: {}

volumes:
  secrets:
  valkey-data:
  docling-models:
  asr-models:
  asr-scratch:
  nlp-models:
